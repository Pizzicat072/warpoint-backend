<!-- public/pages/tools.html -->
<div class="tools-container">
    <div class="tools-header">
        <div class="tools-header-icon">
            <i class="fas fa-tools"></i>
        </div>
        <h1>Инструменты <span>WARPOINT</span></h1>
        <p>Приложения и утилиты для работы с ПК</p>
    </div>

    <div class="tools-actions">
        <button class="btn-primary" id="uploadToolBtn">
            <i class="fas fa-plus"></i> Загрузить приложение
        </button>
    </div>

    <div class="tools-grid" id="toolsGrid">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i> Загрузка инструментов...
        </div>
    </div>

    <!-- Модалка загрузки -->
    <div id="uploadToolModal" class="modal" style="display: none;">
        <div class="modal-window" style="max-width: 500px;">
            <div style="padding: 20px; border-bottom: 1px solid rgba(99,102,241,0.15);">
                <h3>➕ Загрузить приложение</h3>
            </div>
            <div style="padding: 20px;">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="toolName" class="form-input" placeholder="Мой инструмент">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="toolDesc" class="form-textarea" rows="3" placeholder="Описание..."></textarea>
                </div>
                <div class="form-group">
                    <label>Тип файла</label>
                    <select id="toolType" class="form-select">
                        <option value="url">🌐 Ссылка на сайт</option>
                        <option value="exe">💻 Программа (.exe)</option>
                        <option value="bat">📜 Скрипт (.bat)</option>
                        <option value="msi">📦 Установщик (.msi)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ссылка или путь к файлу</label>
                    <input type="text" id="toolPath" class="form-input" placeholder="https://... или C:\...">
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; padding: 16px 20px; border-top: 1px solid rgba(99,102,241,0.1);">
                <button class="btn-secondary" onclick="window.closeUploadToolModal()">Отмена</button>
                <button class="btn-primary" onclick="window.addTool()">Загрузить</button>
            </div>
        </div>
    </div>
</div>

<style>
.tools-container { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
.tools-header { text-align: center; margin-bottom: 28px; padding: 40px; background: rgba(20,25,50,0.5); border-radius: 28px; border: 1px solid rgba(99,102,241,0.2); }
.tools-header-icon { width: 70px; height: 70px; margin: 0 auto 20px; background: linear-gradient(135deg,#10b981,#059669); border-radius: 20px; display:flex; align-items:center; justify-content:center; font-size:32px; color:white; }
.tools-header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
.tools-header h1 span { background: linear-gradient(135deg,#10b981,#34d399); -webkit-background-clip:text; background-clip:text; color:transparent; }
.tools-header p { color: #94a3b8; font-size: 15px; }
.tools-actions { display: flex; justify-content: flex-end; margin-bottom: 24px; }
.tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.tool-card { background: rgba(17,20,28,0.6); backdrop-filter:blur(12px); border-radius: 20px; border: 1px solid rgba(99,102,241,0.15); padding: 24px; cursor: pointer; transition: all 0.25s; }
.tool-card:hover { border-color: rgba(16,185,129,0.4); transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
.tool-icon { font-size: 48px; margin-bottom: 14px; }
.tool-name { font-size: 18px; font-weight: 600; color: #f1f5f9; }
.tool-desc { font-size: 13px; color: #94a3b8; margin: 8px 0; }
.tool-meta { font-size: 11px; color: #64748b; margin-bottom: 16px; }
.tool-actions { display: flex; gap: 10px; }
.btn-launch { background: linear-gradient(135deg,#10b981,#059669); border:none; padding:10px 20px; border-radius:20px; color:white; cursor:pointer; font-weight:500; flex:1; }
.btn-download { background: rgba(99,102,241,0.2); border:1px solid rgba(99,102,241,0.3); padding:10px 20px; border-radius:20px; color:#a78bfa; cursor:pointer; }
.loading-spinner { text-align:center; padding:60px; color:#64748b; grid-column: 1/-1; }
@media (max-width:768px) { .tools-container{padding:16px;} .tools-grid{grid-template-columns:1fr;} }
</style>

<script>
(function() {
    function tryInit() {
        if (typeof window.initTools === 'function') {
            window.initTools();
        } else {
            setTimeout(tryInit, 100);
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryInit);
    } else {
        tryInit();
    }
})();
</script>
