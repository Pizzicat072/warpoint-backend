<div id="createEmployeeModal" class="emp-modal" style="display: none;">
    <div class="emp-modal-window" style="max-width: 500px;">
        
        <!-- Заголовок модалки -->
        <div class="emp-modal-header">
            <div class="emp-modal-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <div class="emp-modal-title">
                <h3>Новый сотрудник</h3>
                <p>Заполните данные для регистрации</p>
            </div>
            <button class="emp-modal-close" id="closeCreateModalBtn">&times;</button>
        </div>
        
        <!-- Тело модалки -->
        <div class="emp-modal-body">
            
            <!-- Имя -->
            <div class="emp-form-group">
                <label><i class="fas fa-user"></i> Имя сотрудника <span style="color: #ef4444;">*</span></label>
                <input type="text" id="newEmpName" class="emp-form-input" placeholder="Введите имя" autocomplete="off" required maxlength="50">
            </div>
            
            <!-- Пароль -->
            <div class="emp-form-group">
                <label><i class="fas fa-lock"></i> Пароль <span style="color: #ef4444;">*</span></label>
                <input type="password" id="newEmpPassword" class="emp-form-input" placeholder="Минимум 3 символа" autocomplete="new-password" required minlength="3">
                <div class="emp-form-hint">Пароль должен быть не менее 3 символов</div>
            </div>
            
            <!-- Должность -->
            <div class="emp-form-group">
                <label><i class="fas fa-briefcase"></i> Должность</label>
                <div class="emp-role-selector">
                    <label class="emp-role-option active" data-role="operator">
                        <input type="radio" name="roleSelect" value="operator" checked>
                        <span class="emp-role-icon">👤</span>
                        <span class="emp-role-info">
                            <span class="emp-role-name">Оператор</span>
                            <span class="emp-role-desc">Базовый доступ к системе</span>
                        </span>
                        <span class="emp-role-check"><i class="fas fa-check-circle"></i></span>
                    </label>
                    <label class="emp-role-option" data-role="admin">
                        <input type="radio" name="roleSelect" value="admin">
                        <span class="emp-role-icon">⚙️</span>
                        <span class="emp-role-info">
                            <span class="emp-role-name">Администратор</span>
                            <span class="emp-role-desc">Управление мероприятиями (ВП)</span>
                        </span>
                        <span class="emp-role-check"><i class="fas fa-check-circle"></i></span>
                    </label>
                    <label class="emp-role-option" data-role="manager">
                        <input type="radio" name="roleSelect" value="manager">
                        <span class="emp-role-icon">📋</span>
                        <span class="emp-role-info">
                            <span class="emp-role-name">Управляющий</span>
                            <span class="emp-role-desc">Расширенный доступ</span>
                        </span>
                        <span class="emp-role-check"><i class="fas fa-check-circle"></i></span>
                    </label>
                </div>
                <input type="hidden" id="newEmpRole" value="operator">
            </div>
            
            <!-- Дата рождения и телефон -->
            <div class="emp-form-row-2">
                <div class="emp-form-group">
                    <label><i class="fas fa-calendar"></i> Дата рождения</label>
                    <input type="date" id="newEmpBirthday" class="emp-form-input" max="">
                </div>
                <div class="emp-form-group">
                    <label><i class="fas fa-phone"></i> Телефон</label>
                    <input type="tel" id="newEmpPhone" class="emp-form-input" placeholder="+7 (___) ___-__-__">
                </div>
            </div>
            
        </div>
        
        <!-- Футер модалки -->
        <div class="emp-modal-footer">
            <button class="emp-btn-secondary" id="cancelCreateBtn">
                <i class="fas fa-times"></i> Отмена
            </button>
            <button class="emp-btn-primary" id="saveCreateBtn">
                <i class="fas fa-check"></i> Создать сотрудника
            </button>
        </div>
        
    </div>
</div>

<!-- СКРИПТЫ ДЛЯ МОДАЛОК -->
<!-- ============================================ -->
<script>
(function() {
    'use strict';
    
    // Ждём загрузки DOM
    function init() {
        // Кнопка создания сотрудника
        const createBtn = document.getElementById('createEmployeeBtn');
        if (createBtn) {
            createBtn.addEventListener('click', function() {
                if (typeof window.openCreateEmployeeModal === 'function') {
                    window.openCreateEmployeeModal();
                }
            });
        }
        
        // Кнопка закрытия модалки создания
        const closeCreateBtn = document.getElementById('closeCreateModalBtn');
        const cancelCreateBtn = document.getElementById('cancelCreateBtn');
        if (closeCreateBtn) closeCreateBtn.addEventListener('click', function() { if (typeof window.closeCreateEmployeeModal === 'function') window.closeCreateEmployeeModal(); });
        if (cancelCreateBtn) cancelCreateBtn.addEventListener('click', function() { if (typeof window.closeCreateEmployeeModal === 'function') window.closeCreateEmployeeModal(); });
        
        // Кнопка сохранения сотрудника
        const saveCreateBtn = document.getElementById('saveCreateBtn');
        if (saveCreateBtn) saveCreateBtn.addEventListener('click', function() { if (typeof window.createEmployee === 'function') window.createEmployee(); });
        
        // Кнопка закрытия модалки аватара
        const closeAvatarBtn = document.getElementById('closeAvatarModalBtn');
        const cancelAvatarBtn = document.getElementById('cancelAvatarBtn');
        if (closeAvatarBtn) closeAvatarBtn.addEventListener('click', function() { if (typeof window.closeAvatarModal === 'function') window.closeAvatarModal(); });
        if (cancelAvatarBtn) cancelAvatarBtn.addEventListener('click', function() { if (typeof window.closeAvatarModal === 'function') window.closeAvatarModal(); });
        
        // Кнопка загрузки аватара
        const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
        if (uploadAvatarBtn) uploadAvatarBtn.addEventListener('click', function() { if (typeof window.openAvatarUploadModal === 'function') window.openAvatarUploadModal(); });
        
        // Кнопки превью
        const closePreviewBtn = document.getElementById('closePreviewModalBtn');
        const cancelPreviewBtn = document.getElementById('cancelPreviewBtn');
        if (closePreviewBtn) closePreviewBtn.addEventListener('click', function() { if (typeof window.closeAvatarPreviewModal === 'function') window.closeAvatarPreviewModal(); });
        if (cancelPreviewBtn) cancelPreviewBtn.addEventListener('click', function() { if (typeof window.closeAvatarPreviewModal === 'function') window.closeAvatarPreviewModal(); });
        
        // Кнопка сохранения фото
        const confirmAvatarBtn = document.getElementById('confirmAvatarBtn');
        if (confirmAvatarBtn) confirmAvatarBtn.addEventListener('click', function() { if (typeof window.confirmAvatarUpload === 'function') window.confirmAvatarUpload(); });
        
        // Выбор роли
        document.querySelectorAll('.emp-role-option').forEach(opt => {
            opt.addEventListener('click', function() {
                const role = this.dataset.role;
                if (role && typeof window.selectRole === 'function') {
                    window.selectRole(role);
                }
            });
        });
        
        // Закрытие модалок по Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (typeof window.closeProfileModal === 'function') window.closeProfileModal();
                if (typeof window.closeCreateEmployeeModal === 'function') window.closeCreateEmployeeModal();
                if (typeof window.closeAvatarModal === 'function') window.closeAvatarModal();
                if (typeof window.closeAvatarPreviewModal === 'function') window.closeAvatarPreviewModal();
            }
        });
        
        // Закрытие модалок по клику на фон
        document.querySelectorAll('.emp-modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    if (this.id === 'profileModal' && typeof window.closeProfileModal === 'function') window.closeProfileModal();
                    if (this.id === 'createEmployeeModal' && typeof window.closeCreateEmployeeModal === 'function') window.closeCreateEmployeeModal();
                    if (this.id === 'avatarModal' && typeof window.closeAvatarModal === 'function') window.closeAvatarModal();
                    if (this.id === 'avatarPreviewModal' && typeof window.closeAvatarPreviewModal === 'function') window.closeAvatarPreviewModal();
                }
            });
        });
        
        // Показываем кнопку создания для директора
        if (window.app?.currentUserRole === 'director') {
            const btn = document.getElementById('createEmployeeBtn');
            if (btn) btn.style.display = 'inline-flex';
        }
        
        console.log('✅ employees.html инициализирован');
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
