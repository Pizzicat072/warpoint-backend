                <div class="salary-field">

                        <span>МЕРОПРИЯТИЕ</span>
                    </div>
                    <div class="salary-field-input">
                        <span class="currency-symbol">₽</span>
                        <input type="number" id="salaryEvent" class="salary-number-input" placeholder="0" value="0">
                    </div>
                </div>

                <div class="salary-field">
                    <div class="salary-field-label">
                        <i class="fas fa-chart-line"></i>
                        <span>ПРЕМИЯ С ОБОРОТА</span>
                    </div>
                    <div class="salary-field-input">
                        <span class="currency-symbol">₽</span>
                        <input type="number" id="salaryTurnover" class="salary-number-input" placeholder="0" value="0">
                    </div>
                </div>

                <div class="salary-field">
                    <div class="salary-field-label">
                        <i class="fas fa-trophy"></i>
                        <span>ПРЕМИЯ ЗА 35 ТЫС.</span>
                    </div>
                    <div class="salary-field-input">
                        <span class="currency-symbol">₽</span>
                        <input type="number" id="salaryBonus35" class="salary-number-input" placeholder="0" value="0">
                    </div>
                </div>

                <div class="salary-field">
                    <div class="salary-field-label">
                        <i class="fas fa-video"></i>
                        <span>РОЛИК / ОТЗЫВ</span>
                    </div>
                    <div class="salary-field-input">
                        <span class="currency-symbol">₽</span>
                        <input type="number" id="salaryVideo" class="salary-number-input" placeholder="0" value="0">
                    </div>
                </div>
            </div>

            <!-- ИТОГО за день -->
            <div class="salary-total-day">
                <div class="total-day-label">
                    <i class="fas fa-calculator"></i>
                    <span>ИТОГО ЗА ДЕНЬ</span>
                </div>
                <div class="total-day-value" id="totalDayValue">0 ₽</div>
            </div>
        </div>

        <div class="day-modal-footer" id="modalFooter">
            <button class="btn-clear" id="clearDayBtn" onclick="clearCurrentDay()">
                <i class="fas fa-eraser"></i>
                <span>Очистить</span>
            </button>
            <button class="btn-save" id="saveDayBtn" onclick="saveCurrentDay()">
                <i class="fas fa-save"></i>
                <span>Сохранить</span>
            </button>
            <button class="btn-close" onclick="closeDayModal()">
                <i class="fas fa-times"></i>
                <span>Закрыть</span>
            </button>
        </div>
    </div>
</div>

<style>
/* ============================================
   PREMIUM SALARY PAGE STYLES v3
   ============================================ */

@keyframes floatGlow {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
    50% { transform: translate(30px, -20px) scale(1.2); opacity: 0.5; }
}

@keyframes floatGlow2 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
    50% { transform: translate(-40px, 30px) scale(1.3); opacity: 0.4; }
}

@keyframes floatGlow3 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.15; }
    50% { transform: translate(20px, 40px) scale(1.1); opacity: 0.3; }
}

@keyframes slideInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

.salary-container {
    position: relative;
    padding: 24px 32px;
    max-width: 100%;
    margin: 0 auto;
    min-height: calc(100vh - 200px);
    overflow-x: auto;
}

/* Анимированный фон */
.salary-bg {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -2;
    pointer-events: none;
    overflow: hidden;
}

.bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.12), transparent 70%);
    top: -200px;
    right: -100px;
    animation: floatGlow 15s ease-in-out infinite;
}

.bg-glow-2 {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.08), transparent 70%);
    bottom: -100px;
    left: -50px;
    animation: floatGlow2 20s ease-in-out infinite;
}

.bg-glow-3 {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.06), transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: floatGlow3 25s ease-in-out infinite;
}

/* Header */
.salary-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 32px;
    padding: 24px 32px;
    background: linear-gradient(135deg, rgba(20, 25, 50, 0.8), rgba(15, 18, 35, 0.6));
    backdrop-filter: blur(20px);
    border-radius: 32px;
    border: 1px solid rgba(251, 191, 36, 0.2);
    flex-wrap: wrap;
    animation: slideInUp 0.5s ease-out;
    position: relative;
    overflow: hidden;
}

.salary-header::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;

    animation: shimmer 3s infinite;
}

.salary-header-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #f59e0b, #d97706);

}

.salary-header-info h1 {
    font-size: 28px;

    background: linear-gradient(135deg, #fff, #fbbf24, #f59e0b);

}

.salary-header-info p {
    font-size: 13px;

}

.salary-role-badge {

.salary-role-badge i {

/* Table Container - ОБЯЗАТЕЛЬНАЯ ГОРИЗОНТАЛЬНАЯ ПРОКРУТКА */
.salary-table-container {
