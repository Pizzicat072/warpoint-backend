<!-- public/pages/fines.html - ИСПРАВЛЕННАЯ ВЕРСИЯ -->
<div class="fines-container">
    <!-- Заголовок -->
    <div class="fines-header">
        <div class="fines-title-section">
            <div class="fines-title-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div>
                <h1 class="fines-title">Нарушения и штрафы</h1>
                <p class="fines-subtitle">Управление дисциплинарными взысканиями</p>
            </div>
        </div>
        <button class="fines-create-btn" onclick="openFineModal()">
            <i class="fas fa-plus"></i>
            <span>Добавить нарушение</span>
        </button>
    </div>

    <!-- Виджеты статистики -->
    <div class="fines-stats-grid" id="finesStats">
        <div class="stat-card">
            <div class="stat-icon">📊</div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Всего</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📅</div>
            <div class="stat-value" id="statMonthly">0</div>
            <div class="stat-label">За месяц</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">⏳</div>
            <div class="stat-value" id="statPending">0</div>
            <div class="stat-label">На рассмотрении</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-value" id="statApproved">0</div>
            <div class="stat-label">Подтверждено</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">❌</div>
            <div class="stat-value" id="statRejected">0</div>
            <div class="stat-label">Отклонено</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">💵</div>
            <div class="stat-value" id="statMoneyAmount">0 ₽</div>
            <div class="stat-label">Штрафы (₽)</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">💰</div>
            <div class="stat-value" id="statCoinsAmount">0</div>
            <div class="stat-label">Штрафы (ВП-коины)</div>
        </div>
    </div>

    <!-- Фильтры -->
    <div class="fines-filters">
        <div class="filters-left">
            <div class="filter-group">
                <i class="fas fa-search"></i>
                <input type="text" id="fineSearch" placeholder="Поиск по сотруднику...">
            </div>
            <div class="filter-group">
                <i class="fas fa-filter"></i>
                <select id="fineStatusFilter">
                    <option value="all">Все статусы</option>
                    <option value="pending">⏳ На рассмотрении</option>
                    <option value="approved">✅ Подтверждено</option>
                    <option value="rejected">❌ Отклонено</option>
                    <option value="appeal">⚖️ Апелляция</option>
                </select>
            </div>
            <div class="filter-group">
                <i class="fas fa-user"></i>
                <select id="fineEmployeeFilter">
                    <option value="all">Все сотрудники</option>
                </select>
            </div>
            <div class="filter-group">
                <i class="fas fa-tag"></i>
                <select id="fineTypeFilter">
                    <option value="all">Все типы</option>
                    <option value="money">💵 Деньги</option>
                    <option value="coins">💰 ВП-коины</option>
                    <option value="rating">⭐ Рейтинг</option>
                </select>
            </div>
            <div class="filter-group">
                <i class="fas fa-calendar"></i>
                <select id="fineMonthFilter">
                    <option value="all">Все месяцы</option>
                </select>
            </div>
        </div>
        <div class="filters-right">
            <button class="filter-reset" onclick="resetFineFilters()" title="Сбросить фильтры">
                <i class="fas fa-undo-alt"></i>
            </button>
        </div>
    </div>

    <!-- Таблица нарушений -->
    <div class="fines-table-container">
        <table class="fines-table">
            <thead>
                <tr>
                    <th>📅 Дата</th>
                    <th>👤 Сотрудник</th>
                    <th>Тип</th>
                    <th>Штраф</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="finesTableBody">
                <tr><td colspan="6" class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Загрузка...<\/td></tr>
            </tbody>
        </table>
    </div>
</div>

<style>
/* ============================================
   FINES PAGE STYLES
   ============================================ */

.fines-container {
    padding: 24px 32px;
    max-width: 1400px;
    margin: 0 auto;
}

/* Header */
.fines-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 20px;
}

.fines-title-section {
    display: flex;
    align-items: center;
    gap: 16px;
}

.fines-title-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.fines-title {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 4px 0;
    background: linear-gradient(135deg, #fff, #ef4444);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.fines-subtitle {
    font-size: 13px;
    color: #94a3b8;
    margin: 0;
}

.fines-create-btn {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border: none;
    border-radius: 40px;
    padding: 12px 28px;
    color: white;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.2s;
}

.fines-create-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
}

/* Stats Widgets */
.fines-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
}

.fines-stats-grid .stat-card {
    background: rgba(17, 24, 39, 0.6);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(239, 68, 68, 0.15);
    transition: all 0.2s;
}

.fines-stats-grid .stat-card:hover {
    transform: translateY(-2px);
    border-color: rgba(239, 68, 68, 0.4);
}

.fines-stats-grid .stat-icon {
    font-size: 22px;
    margin-bottom: 4px;
}

.fines-stats-grid .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: #fbbf24;
}

.fines-stats-grid .stat-label {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 4px;
}

/* Filters */
.fines-filters {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    padding: 12px 20px;
    background: rgba(17, 24, 39, 0.5);
    border-radius: 16px;
    border: 1px solid rgba(239, 68, 68, 0.15);
}

.filters-left {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex: 1;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.3);
    padding: 0 14px;
    border-radius: 30px;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.filter-group i {
    color: #ef4444;
    font-size: 12px;
}

.filter-group input, 
.filter-group select {
    background: transparent;
    border: none;
    padding: 8px 0;
    color: #e2e8f0;
    font-size: 12px;
    outline: none;
    cursor: pointer;
}

.filter-group select option {
    background: #1e293b;
}

.filter-group input {
    min-width: 160px;
}

.filter-group input::placeholder {
    color: #475569;
}

.filters-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.filter-reset {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #f87171;
    transition: all 0.2s;
}

.filter-reset:hover {
    background: rgba(239, 68, 68, 0.3);
    transform: rotate(15deg);
}

/* Table */
.fines-table-container {
    background: rgba(17, 24, 39, 0.5);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(239, 68, 68, 0.15);
    overflow-x: auto;
    margin-bottom: 20px;
}

.fines-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 700px;
}

.fines-table th {
    padding: 14px 12px;
    text-align: left;
    background: rgba(239, 68, 68, 0.08);
    font-weight: 600;
    color: #e2e8f0;
    border-bottom: 1px solid rgba(239, 68, 68, 0.2);
    font-size: 12px;
}

.fines-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    vertical-align: middle;
}

.fines-table tr:hover td {
    background: rgba(239, 68, 68, 0.05);
}

/* Status Badges */
.status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
}

.status-pending {
    background: rgba(245, 158, 11, 0.2);
    color: #f59e0b;
    border: 1px solid rgba(245, 158, 11, 0.3);
}

.status-approved {
    background: rgba(16, 185, 129, 0.2);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.3);
}

.status-rejected {
    background: rgba(107, 114, 128, 0.2);
    color: #9ca3af;
    border: 1px solid rgba(107, 114, 128, 0.3);
}

.status-appeal {
    background: rgba(139, 92, 246, 0.2);
    color: #a78bfa;
    border: 1px solid rgba(139, 92, 246, 0.3);
}

/* Penalty cell */
.penalty-money {
    color: #fbbf24;
}

/* Buttons */
.btn-action {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    margin-right: 4px;
    white-space: nowrap;
}

.btn-approve {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #10b981;
}

.btn-approve:hover {
    background: rgba(16, 185, 129, 0.3);
}

.btn-view {
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #a78bfa;
}

.btn-view:hover {
    background: rgba(99, 102, 241, 0.3);
}

.btn-delete {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #ef4444;
}

.btn-delete:hover {
    background: rgba(239, 68, 68, 0.3);
}

.loading-spinner {
    text-align: center;
    padding: 40px;
    color: #64748b;
}

/* Responsive */
@media (max-width: 768px) {
    .fines-container {
        padding: 16px;
    }
    
    .fines-header {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .fines-title {
        font-size: 24px;
    }
    
    .fines-stats-grid {
        grid-template-columns: repeat(4, 1fr);
    }
    
    .filters-left {
        width: 100%;
    }
    
    .filter-group {
        flex: 1;
    }
    
    .filter-group input {
        min-width: auto;
    }
}

@media (max-width: 480px) {
    .fines-stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .filters-left {
        flex-direction: column;
    }
    
    .filter-group {
        width: 100%;
    }
}
/* Стиль для нарушений от "Система" */
.fine-system-created {
    position: relative;
    animation: systemPulse 1.5s ease-in-out infinite;
}

@keyframes systemPulse {
    0%, 100% {
        box-shadow: 0 0 5px rgba(239, 68, 68, 0.5);
        border-left-color: #ef4444;
    }
    50% {
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
        border-left-color: #ff6b6b;
    }
}

.system-badge {
    background: linear-gradient(135deg, #ef4444, #dc2626, #ef4444);
    background-size: 200% 200%;
    animation: systemGradient 1s ease infinite;
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 8px;
}

@keyframes systemGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
</style>

<script>
function resetFineFilters() {
    const searchInput = document.getElementById('fineSearch');
    const statusFilter = document.getElementById('fineStatusFilter');
    const employeeFilter = document.getElementById('fineEmployeeFilter');
    const typeFilter = document.getElementById('fineTypeFilter');
    const monthFilter = document.getElementById('fineMonthFilter');
    
    if (searchInput) searchInput.value = '';
    if (statusFilter) statusFilter.value = 'all';
    if (employeeFilter) employeeFilter.value = 'all';
    if (typeFilter) typeFilter.value = 'all';
    if (monthFilter) monthFilter.value = 'all';
    
    if (typeof window.currentFineStatusFilter !== 'undefined') window.currentFineStatusFilter = 'all';
    if (typeof window.currentFineEmployeeFilter !== 'undefined') window.currentFineEmployeeFilter = 'all';
    if (typeof window.currentFineTypeFilter !== 'undefined') window.currentFineTypeFilter = 'all';
    if (typeof window.currentFineMonthFilter !== 'undefined') window.currentFineMonthFilter = 'all';
    
    if (typeof renderFinesTable === 'function') renderFinesTable();
}
</script>
