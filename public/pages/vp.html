<!-- public/pages/vp.html — ИСПРАВЛЕННАЯ ВЕРСИЯ v4.5 -->
<div class="vp-container">
    <div class="vp-bg">
        <div class="bg-glow"></div>
        <div class="bg-glow-2"></div>
        <div class="bg-glow-3"></div>
    </div>

    <div class="vp-header">
        <div class="vp-header-icon">
            <i class="fas fa-gamepad"></i>
        </div>
        <div class="vp-header-info">
            <h1>Учёт мероприятий и П/О</h1>
            <p>Управление бронированиями, фото и отзывами</p>
        </div>
        <div class="vp-header-actions">
            <button class="vp-today-btn" id="vpTodayBtn">
                <i class="fas fa-calendar-day"></i>
                <span>Сегодня</span>
            </button>
            <div class="vp-role-badge" id="vpAccessBadge">
                <i class="fas fa-eye"></i>
                <span>Только просмотр</span>
            </div>
        </div>
    </div>

    <div class="vp-controls">
        <div class="vp-period">
            <button class="month-nav" id="vpPrevMonth" title="Предыдущий месяц">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="current-period">
                <span class="period-month-display" id="vpMonthDisplay">Март</span>
                <span class="period-year-display" id="vpYearDisplay">2026</span>
            </div>
            <button class="month-nav" id="vpNextMonth" title="Следующий месяц">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        
        <div class="filter-group search-group">
            <i class="fas fa-search"></i>
            <input type="text" id="vpSearch" placeholder="Поиск по клиенту или админу...">
            <button class="clear-search-btn" id="clearSearchBtn" style="display: none;" title="Очистить">✕</button>
        </div>
        
        <div class="vp-actions">
            <button class="vp-export-btn" id="vpExportBtn" title="Экспорт в Excel">
                <i class="fas fa-file-excel"></i>
                <span>Экспорт</span>
            </button>
            <button class="vp-add-btn" id="vpAddBtn">
                <i class="fas fa-plus"></i>
                <span>Добавить мероприятие</span>
            </button>
        </div>
    </div>

    <div class="vp-stats-grid">
        <div class="stat-card" title="Всего мероприятий за выбранный месяц">
            <div class="stat-icon">🎮</div>
            <div class="stat-value" id="vpTotalCount">0</div>
            <div class="stat-label">Мероприятий</div>
        </div>
        <div class="stat-card" title="Общая сумма всех мероприятий">
            <div class="stat-icon">💰</div>
            <div class="stat-value" id="vpTotalAmount">0 ₽</div>
            <div class="stat-label">Общая сумма</div>
        </div>
        <div class="stat-card" title="Мероприятия, ожидающие отправки фото">
            <div class="stat-icon">📸</div>
            <div class="stat-value" id="vpPhotoPending">0</div>
            <div class="stat-label">Ожидают фото</div>
        </div>
        <div class="stat-card" title="Мероприятия, по которым не отправлен отзыв">
            <div class="stat-icon">📝</div>
            <div class="stat-value" id="vpScriptPending">0</div>
            <div class="stat-label">Нет отзыва</div>
        </div>
        <div class="stat-card" title="Мероприятия в архиве">
            <div class="stat-icon">📦</div>
            <div class="stat-value" id="vpArchivedCount">0</div>
            <div class="stat-label">В архиве</div>
        </div>
        <div class="stat-card" title="Мероприятия с просроченной оплатой (более 2 дней)">
            <div class="stat-icon">⚠️</div>
            <div class="stat-value" id="vpUnpaidOverdue">0</div>
            <div class="stat-label">Просрочка оплаты</div>
        </div>
    </div>

    <div class="vp-filters">
        <div class="filters-left">
            <div class="filter-group">
                <i class="fas fa-filter"></i>
                <select id="vpStatusFilter">
                    <option value="all">Все статусы</option>
                    <option value="photo_pending">📸 Ожидают фото</option>
                    <option value="script_pending">📝 Ожидают отзыва</option>
                    <option value="unpaid">⚠️ Просрочка оплаты</option>
                </select>
            </div>
            <div class="filter-group">
                <i class="fas fa-user"></i>
                <select id="vpAdminFilter">
                    <option value="all">Все админы</option>
                </select>
            </div>
            <label class="filter-checkbox">
                <input type="checkbox" id="filterMyOnly">
                <span>👤 Только мои</span>
            </label>
        </div>
        <div class="filters-right">
            <label class="archive-checkbox">
                <input type="checkbox" id="showArchived">
                <span>📦 Показать архив</span>
            </label>
            <button class="filter-reset" id="resetFiltersBtn" title="Сбросить фильтры">
                <i class="fas fa-undo-alt"></i>
            </button>
        </div>
    </div>

    <div class="vp-table-container">
        <table class="vp-table">
            <thead>
                <tr>
                    <th class="sortable" data-field="date">📅 Дата <i class="fas fa-sort"></i></th>
                    <th>⏰ Время</th>
                    <th class="sortable" data-field="customer">👤 Клиент <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-field="admin">🛡️ Админ <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-field="amount">💰 Сумма <i class="fas fa-sort"></i></th>
                    <th>💳 Оплата</th>
                    <th>📸 Фото</th>
                    <th>📝 Отзыв</th>
                    <th>⚙️ Действия</th>
                </tr>
            </thead>
            <tbody id="vpTableBody">
                <tr><td colspan="9" class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Загрузка...</td></tr>
            </tbody>
            <tfoot id="vpTableFooter" style="display: none;">
                <tr>
                    <td colspan="4" style="text-align: right; font-weight: 600;">ИТОГО:</td>
                    <td id="footerTotalAmount" style="font-weight: 700; color: #fbbf24;">0 ₽</td>
                    <td colspan="4"></td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<style>

.vp-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -2; pointer-events: none; overflow: hidden; }
.bg-glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(16,185,129,0.12), transparent 70%); top: -200px; right: -100px; animation: floatGlow 15s ease-in-out infinite; }
.bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(52,211,153,0.08), transparent 70%); bottom: -150px; left: -80px; animation: floatGlow2 20s ease-in-out infinite; }
.bg-glow-3 { position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(6,148,162,0.06), transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); animation: floatGlow3 25s ease-in-out infinite; }
@keyframes floatGlow { 0%,100%{transform:translate(0,0) scale(1);opacity:0.4;} 50%{transform:translate(30px,-20px) scale(1.3);opacity:0.6;} }
@keyframes floatGlow2 { 0%,100%{transform:translate(0,0) scale(1);opacity:0.25;} 50%{transform:translate(-40px,30px) scale(1.4);opacity:0.45;} }
@keyframes floatGlow3 { 0%,100%{transform:translate(0,0) scale(1);opacity:0.2;} 50%{transform:translate(20px,40px) scale(1.2);opacity:0.35;} }

.vp-header-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
.vp-header-info h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px 0; background: linear-gradient(135deg, #fff, #10b981); -webkit-background-clip: text; background-clip: text; color: transparent; }
.vp-header-info p { font-size: 13px; color: #94a3b8; margin: 0; }

.vp-period { display: flex; align-items: center; gap: 16px; }
.month-nav { width: 40px; height: 40px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #10b981; transition: all 0.2s; }

.filter-checkbox input { width: 18px; height: 18px; cursor: pointer; accent-color: #10b981; }
.filters-right { display: flex; align-items: center; gap: 12px; }
.archive-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #94a3b8; background: rgba(0,0,0,0.3); padding: 0 16px; border-radius: 40px; border: 1px solid rgba(16,185,129,0.2); height: 42px; }
.archive-checkbox input { width: 18px; height: 18px; cursor: pointer; accent-color: #10b981; }
.filter-reset { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #10b981; transition: all 0.2s; }

.vp-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: rgba(17,24,39,0.6); backdrop-filter: blur(12px); border-radius: 20px; padding: 16px; text-align: center; border: 1px solid rgba(16,185,129,0.2); transition: all 0.2s; cursor: help; }
.stat-card:hover { transform: translateY(-3px); border-color: rgba(16,185,129,0.5); }
.stat-icon { font-size: 28px; margin-bottom: 8px; }
.stat-value { font-size: 24px; font-weight: 700; color: #10b981; }
.stat-label { font-size: 11px; color: #94a3b8; margin-top: 6px; }

.vp-table-container { background: rgba(17,24,39,0.5); backdrop-filter: blur(12px); border-radius: 20px; border: 1px solid rgba(16,185,129,0.15); overflow-x: auto; margin-bottom: 32px; max-height: 500px; overflow-y: auto; }
.vp-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1100px; }
.vp-table th { padding: 14px 12px; text-align: left; background: rgba(16,185,129,0.1); font-weight: 600; color: #e2e8f0; border-bottom: 1px solid rgba(16,185,129,0.2); white-space: nowrap; position: sticky; top: 0; z-index: 10; }
.vp-table th.sortable { cursor: pointer; user-select: none; }
.vp-table th.sortable:hover { background: rgba(16,185,129,0.2); }
.vp-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.vp-table tbody tr:hover { background: rgba(16,185,129,0.08); }

.payment-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.payment-evector_card { background: rgba(59,130,246,0.15); color: #3b82f6; }
.payment-evector_cash { background: rgba(16,185,129,0.15); color: #10b981; }
.payment-vtb { background: rgba(139,92,246,0.15); color: #a78bfa; }
.payment-sber { background: rgba(16,185,129,0.15); color: #10b981; }
.payment-not_paid { background: rgba(245,158,11,0.15); color: #f59e0b; animation: pulse 1.5s infinite; }

.btn-photo:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
.btn-script { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; }
.btn-script:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139,92,246,0.4); }
.btn-small { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); border-radius: 20px; padding: 5px 12px; font-size: 11px; color: #10b981; cursor: pointer; transition: all 0.2s; margin-right: 6px; }
.btn-small:hover { background: rgba(16,185,129,0.3); }

@media (max-width:480px){ .vp-stats-grid{grid-template-columns:1fr;} .vp-today-btn span,.vp-export-btn span,.vp-add-btn span{display:none;} }
</style>

<script>
(function() {
    'use strict';
    
    // Временные заглушки для инициализации
    const container = document.getElementById('vpTableBody');
    if (container) {
        // Ждем загрузки vp.js
        const checkVp = setInterval(function() {
            if (typeof window.initVp === 'function') {
                clearInterval(checkVp);
                window.initVp();
            }
        }, 100);
        
        // Таймаут на случай если vp.js не загрузится
        setTimeout(function() {
            if (typeof window.initVp !== 'function') {
                console.warn('VP: vp.js не загружен, использую заглушку');
                container.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;">Загрузка модуля ВП...</td></tr>';
            }
        }, 3000);
    }
    
    // Привязка событий к кнопкам
    document.addEventListener('DOMContentLoaded', function() {
        const addBtn = document.getElementById('vpAddBtn');
        const todayBtn = document.getElementById('vpTodayBtn');
        const exportBtn = document.getElementById('vpExportBtn');
        const prevBtn = document.getElementById('vpPrevMonth');
        const nextBtn = document.getElementById('vpNextMonth');
        const resetBtn = document.getElementById('resetFiltersBtn');
        const statusFilter = document.getElementById('vpStatusFilter');
        const adminFilter = document.getElementById('vpAdminFilter');
        const myOnlyCheck = document.getElementById('filterMyOnly');
        const showArchived = document.getElementById('showArchived');
        const searchInput = document.getElementById('vpSearch');
        const clearSearch = document.getElementById('clearSearchBtn');
        
        if (addBtn) addBtn.addEventListener('click', function() { if (window.openVpModal) window.openVpModal(); });
        if (todayBtn) todayBtn.addEventListener('click', function() { if (window.goToToday) window.goToToday(); });
        if (exportBtn) exportBtn.addEventListener('click', function() { if (window.exportVpToExcel) window.exportVpToExcel(); });
        if (prevBtn) prevBtn.addEventListener('click', function() { if (window.changeVpMonth) window.changeVpMonth(-1); });
        if (nextBtn) nextBtn.addEventListener('click', function() { if (window.changeVpMonth) window.changeVpMonth(1); });
        if (resetBtn) resetBtn.addEventListener('click', function() { if (window.resetVpFilters) window.resetVpFilters(); });
        if (statusFilter) statusFilter.addEventListener('change', function() { if (window.filterByStatus) window.filterByStatus(); });
        if (adminFilter) adminFilter.addEventListener('change', function() { if (window.filterByAdmin) window.filterByAdmin(); });
        if (myOnlyCheck) myOnlyCheck.addEventListener('change', function() { if (window.filterMyOnly) window.filterMyOnly(); });
        if (showArchived) showArchived.addEventListener('change', function(e) { if (window.vpFilters) { window.vpFilters.showArchived = e.target.checked; if (window.loadVpData) window.loadVpData(); } });
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                if (clearSearch) clearSearch.style.display = this.value ? 'flex' : 'none';
                if (window.vpFilters) {
                    window.vpFilters.search = this.value.toLowerCase();
                    if (window.renderVpTable) window.renderVpTable();
                }
            });
        }
        if (clearSearch) {
            clearSearch.addEventListener('click', function() {
                if (searchInput) searchInput.value = '';
                clearSearch.style.display = 'none';
                if (window.vpFilters) { window.vpFilters.search = ''; if (window.renderVpTable) window.renderVpTable(); }
            });
        }
        
        // Сортировка по клику на заголовки
        document.querySelectorAll('.vp-table th.sortable').forEach(th => {
            th.addEventListener('click', function() {
                const field = this.dataset.field;
                if (field && window.sortVpBy) window.sortVpBy(field);
            });
        });
    });
})();
</script>
