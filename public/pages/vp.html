<!-- public/pages/vp.html -->
<div class="vp-container">
    <div class="vp-bg">
        <div class="bg-glow"></div>
        <div class="bg-glow-2"></div>
        <div class="bg-glow-3"></div>
    </div>

    <div class="vp-header">
        <div class="vp-header-icon">
            <i class="fas fa-gamepad"></i>
        </div>
        <div class="vp-header-info">
            <h1>Учёт мероприятий и П/О</h1>
            <p>Управление бронированиями, фото и отзывами</p>
        </div>
        <div class="vp-role-badge" id="vpAccessBadge">
            <i class="fas fa-eye"></i>
            <span>Только просмотр</span>
        </div>
    </div>

    <div class="vp-controls">
        <div class="vp-period">
            <button class="month-nav" id="vpPrevMonth" title="Предыдущий месяц">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="current-period">
                <span class="period-month-display" id="vpMonthDisplay">Март</span>
                <span class="period-year-display" id="vpYearDisplay">2026</span>
            </div>
            <button class="month-nav" id="vpNextMonth" title="Следующий месяц">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        <div class="filter-group search-group">
            <i class="fas fa-search"></i>
            <input type="text" id="vpSearch" placeholder="Поиск по клиенту или админу...">
        </div>
        <button class="vp-add-btn" id="vpAddBtn">
            <i class="fas fa-plus"></i>
            <span>Добавить мероприятие</span>
        </button>
    </div>

    <div class="vp-stats-grid">
        <div class="stat-card">
            <div class="stat-icon">🎮</div>
            <div class="stat-value" id="vpTotalCount">0</div>
            <div class="stat-label">Мероприятий</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">💰</div>
            <div class="stat-value" id="vpTotalAmount">0 ₽</div>
            <div class="stat-label">Общая сумма</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📸</div>
            <div class="stat-value" id="vpPhotoPending">0</div>
            <div class="stat-label">Ожидают фото</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📝</div>
            <div class="stat-value" id="vpScriptPending">0</div>
            <div class="stat-label">Нет отзыва</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📦</div>
            <div class="stat-value" id="vpArchivedCount">0</div>
            <div class="stat-label">В архиве</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">⚠️</div>
            <div class="stat-value" id="vpUnpaidOverdue">0</div>
            <div class="stat-label">Просрочка оплаты</div>
        </div>
    </div>

    <div class="vp-filters">
        <div class="filters-right">
            <label class="archive-checkbox">
                <input type="checkbox" id="showArchived">
                <span>📦 Показать архив</span>
            </label>
            <button class="filter-reset" onclick="resetVpFilters()" title="Сбросить фильтры">
                <i class="fas fa-undo-alt"></i>
            </button>
        </div>
    </div>

    <div class="vp-table-container">
        <table class="vp-table">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Время</th>
                    <th>Клиент</th>
                    <th>Админ</th>
                    <th>Сумма</th>
                    <th>Оплата</th>
                    <th>Фото</th>
                    <th>Отзыв</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="vpTableBody">
                <tr><td colspan="9" class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<style>
/* ============================================
   VP PAGE STYLES
   ============================================ */

.vp-container {
    padding: 24px 32px;
    max-width: 1400px;
    margin: 0 auto;
}

/* Анимированный фон */
.vp-bg {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -2;
    pointer-events: none;
    overflow: hidden;
}

.bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15), transparent 70%);
    top: -200px;
    right: -100px;
    animation: floatGlow 15s ease-in-out infinite;
}

.bg-glow-2 {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(52, 211, 153, 0.1), transparent 70%);
    bottom: -150px;
    left: -80px;
    animation: floatGlow2 20s ease-in-out infinite;
}

.bg-glow-3 {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(6, 148, 162, 0.08), transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: floatGlow3 25s ease-in-out infinite;
}

@keyframes floatGlow {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
    50% { transform: translate(30px, -20px) scale(1.3); opacity: 0.6; }
}

@keyframes floatGlow2 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
    50% { transform: translate(-40px, 30px) scale(1.4); opacity: 0.45; }
}

@keyframes floatGlow3 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
    50% { transform: translate(20px, 40px) scale(1.2); opacity: 0.35; }
}

/* Header */
.vp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 32px;
    padding: 20px 28px;
    background: linear-gradient(135deg, rgba(20, 25, 50, 0.85), rgba(15, 18, 35, 0.7));
    backdrop-filter: blur(20px);
    border-radius: 28px;
    border: 1px solid rgba(16, 185, 129, 0.4);
    flex-wrap: wrap;
}

.vp-header-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
}

.vp-header-info h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 4px 0;
    background: linear-gradient(135deg, #fff, #10b981);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.vp-header-info p {
    font-size: 13px;
    color: #94a3b8;
    margin: 0;
}

.vp-role-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 40px;
    border: 1px solid rgba(16, 185, 129, 0.3);
}

.vp-role-badge i {
    font-size: 14px;
    color: #10b981;
}

.vp-role-badge span {
    font-size: 13px;
    font-weight: 500;
}

/* Controls */
.vp-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
    padding: 12px 20px;
    background: rgba(17, 24, 39, 0.6);
    backdrop-filter: blur(12px);
    border-radius: 50px;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.vp-period {
    display: flex;
    align-items: center;
    gap: 16px;
}

.month-nav {
    width: 40px;
    height: 40px;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #10b981;
    transition: all 0.2s;
}

.month-nav:hover {
    background: rgba(16, 185, 129, 0.3);
    transform: scale(1.05);
}

.current-period {
    text-align: center;
    min-width: 160px;
    padding: 6px 20px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 40px;
}

.period-month-display {
    font-size: 18px;
    font-weight: 600;
    color: #10b981;
}

.period-year-display {
    font-size: 14px;
    color: #94a3b8;
    margin-left: 6px;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.3);
    padding: 0 16px;
    border-radius: 40px;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.filter-group i {
    color: #10b981;
}

.filter-group input {
    background: transparent;
    border: none;
    padding: 10px 0;
    color: #e2e8f0;
    font-size: 13px;
    outline: none;
    width: 220px;
}

.filter-group input::placeholder {
    color: #475569;
}

.vp-add-btn {
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    border-radius: 40px;
    padding: 10px 24px;
    color: white;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.vp-add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
}

/* Filters row */
.vp-filters {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 20px;
}

.filters-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.archive-checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    color: #94a3b8;
    background: rgba(0, 0, 0, 0.3);
    padding: 8px 16px;
    border-radius: 40px;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.archive-checkbox input {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #10b981;
}

.filter-reset {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 40px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #10b981;
    transition: all 0.2s;
}

.filter-reset:hover {
    background: rgba(16, 185, 129, 0.3);
    transform: rotate(15deg);
}

/* Stats Grid */
.vp-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
}

.stat-card {
    background: rgba(17, 24, 39, 0.6);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    border: 1px solid rgba(16, 185, 129, 0.2);
    transition: all 0.2s;
}

.stat-card:hover {
    transform: translateY(-3px);
    border-color: rgba(16, 185, 129, 0.5);
}

.stat-icon {
    font-size: 28px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 24px;
    font-weight: 700;
    color: #10b981;
}

.stat-label {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
}

/* Table Container */
.vp-table-container {
    background: rgba(17, 24, 39, 0.5);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    border: 1px solid rgba(16, 185, 129, 0.15);
    overflow-x: auto;
    margin-bottom: 32px;
}

.vp-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 1000px;
}

.vp-table th {
    padding: 14px 12px;
    text-align: left;
    background: rgba(16, 185, 129, 0.1);
    font-weight: 600;
    color: #e2e8f0;
    border-bottom: 1px solid rgba(16, 185, 129, 0.2);
    white-space: nowrap;
}

.vp-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.vp-table tr:hover td {
    background: rgba(16, 185, 129, 0.05);
}

/* Row highlight for unpaid overdue */
.vp-row-unpaid {
    background: rgba(239, 68, 68, 0.1);
    border-left: 3px solid #ef4444;
}

.vp-row-unpaid:hover td {
    background: rgba(239, 68, 68, 0.15);
}

/* Status Badges */
.status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
}

.status-success {
    background: rgba(16, 185, 129, 0.2);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.3);
}

.status-pending {
    background: rgba(100, 116, 139, 0.2);
    color: #94a3b8;
    border: 1px solid rgba(100, 116, 139, 0.3);
}

.status-warning {
    background: rgba(245, 158, 11, 0.2);
    color: #f59e0b;
    border: 1px solid rgba(245, 158, 11, 0.3);
    animation: pulse 1s infinite;
}

.status-archived {
    background: rgba(107, 114, 128, 0.2);
    color: #6b7280;
    border: 1px solid rgba(107, 114, 128, 0.3);
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

/* Action Buttons */
.btn-action {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    white-space: nowrap;
}

.btn-photo {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
}

.btn-photo:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
}

.btn-script {
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    color: white;
}

.btn-script:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
}

.btn-small {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    color: #10b981;
    cursor: pointer;
    transition: all 0.2s;
    margin-right: 6px;
}

.btn-small:hover {
    background: rgba(16, 185, 129, 0.3);
}

.btn-delete {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.3);
    color: #f87171;
}

.btn-delete:hover {
    background: rgba(239, 68, 68, 0.3);
}

.btn-restore {
    background: rgba(16, 185, 129, 0.15);
    border-color: rgba(16, 185, 129, 0.3);
    color: #10b981;
}

.btn-restore:hover {
    background: rgba(16, 185, 129, 0.3);
}

.btn-danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.3);
    color: #ef4444;
}

.btn-danger:hover {
    background: rgba(239, 68, 68, 0.3);
}

.quick-action-cell {
    min-width: 130px;
}

/* Clickable customer */
.clickable-customer {
    cursor: pointer;
    transition: all 0.2s;
    color: #a78bfa;
}

.clickable-customer:hover {
    color: #c084fc;
    text-decoration: underline;
}

.loading-spinner {
    text-align: center;
    padding: 40px;
    color: #64748b;
}

/* Responsive */
@media (max-width: 768px) {
    .vp-container {
        padding: 16px;
    }
    
    .vp-header {
        flex-direction: column;
        text-align: center;
    }
    
    .vp-controls {
        flex-direction: column;
        border-radius: 24px;
    }
    
    .vp-period {
        width: 100%;
        justify-content: center;
    }
    
    .filter-group {
        width: 100%;
    }
    
    .filter-group input {
        width: 100%;
    }
    
    .vp-add-btn {
        width: 100%;
        justify-content: center;
    }
    
    .vp-stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    
    .vp-filters {
        justify-content: center;
    }
    
    .btn-action {
        padding: 4px 10px;
        font-size: 10px;
    }
    
    .btn-small {
        padding: 4px 8px;
        font-size: 10px;
    }
}

@media (max-width: 480px) {
    .vp-stats-grid {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
function resetVpFilters() {
    const searchInput = document.getElementById('vpSearch');
    const showArchivedCheckbox = document.getElementById('showArchived');
    
    if (searchInput) searchInput.value = '';
    if (showArchivedCheckbox) {
        showArchivedCheckbox.checked = false;
        if (typeof window.vpFilters !== 'undefined') window.vpFilters.showArchived = false;
    }
    
    if (typeof renderVpTable === 'function') {
        renderVpTable();
    }
}
</script>
