.bg-glow {

    width: 600px;

.bg-glow-2 {

    height: 500px;

}

<script>
// ============================================
// ГЛОБАЛЬНЫЕ ФУНКЦИИ ДЛЯ ВП (ИСПРАВЛЕНО)
// ============================================

// Переход к сегодняшней дате
window.goToToday = function() {
    const now = new Date();
    if (typeof vpCurrentYear !== 'undefined' && typeof vpCurrentMonth !== 'undefined') {
        vpCurrentYear = now.getFullYear();
        vpCurrentMonth = now.getMonth() + 1;
        
        if (vpCurrentYear < VP_START_YEAR || (vpCurrentYear === VP_START_YEAR && vpCurrentMonth < VP_START_MONTH)) {
            vpCurrentYear = VP_START_YEAR;
            vpCurrentMonth = VP_START_MONTH;
        }
        
        if (typeof updateVpDisplay === 'function') updateVpDisplay();
        if (typeof updateMonthButtons === 'function') updateMonthButtons();
        if (typeof updateUrl === 'function') updateUrl();
        if (typeof loadVpData === 'function') loadVpData();
    }
};

// Сброс фильтров
window.resetVpFilters = function() {
    const searchInput = document.getElementById('vpSearch');
    const showArchivedCheckbox = document.getElementById('showArchived');
    const statusFilter = document.getElementById('vpStatusFilter');
    const adminFilter = document.getElementById('vpAdminFilter');
    const myOnlyCheckbox = document.getElementById('filterMyOnly');
    
    if (searchInput) searchInput.value = '';
    if (showArchivedCheckbox) showArchivedCheckbox.checked = false;
    if (statusFilter) statusFilter.value = 'all';
    if (adminFilter) adminFilter.value = 'all';
    if (myOnlyCheckbox) myOnlyCheckbox.checked = false;
    
    if (typeof vpFilters !== 'undefined') {
        vpFilters.search = '';
        vpFilters.showArchived = false;
    }
    
    if (typeof vpStatusFilter !== 'undefined') vpStatusFilter = 'all';
    if (typeof vpAdminFilter !== 'undefined') vpAdminFilter = 'all';
    if (typeof vpMyOnly !== 'undefined') vpMyOnly = false;
    
    if (typeof renderVpTable === 'function') renderVpTable();
    
    const clearBtn = document.getElementById('clearSearchBtn');
    if (clearBtn) clearBtn.style.display = 'none';
};

// Фильтр "Только мои"
window.filterMyOnly = function() {
    const checkbox = document.getElementById('filterMyOnly');
    if (typeof vpMyOnly !== 'undefined') {
        vpMyOnly = checkbox?.checked || false;
    }
    if (typeof renderVpTable === 'function') renderVpTable();
};

// Фильтр по админу
window.filterByAdmin = function() {
    const select = document.getElementById('vpAdminFilter');
    if (typeof vpAdminFilter !== 'undefined') {
        vpAdminFilter = select?.value || 'all';
    }
    if (typeof renderVpTable === 'function') renderVpTable();
};

// Фильтр по статусу
window.filterByStatus = function() {
    const select = document.getElementById('vpStatusFilter');
    if (typeof vpStatusFilter !== 'undefined') {
        vpStatusFilter = select?.value || 'all';
    }
    if (typeof renderVpTable === 'function') renderVpTable();
};

// Сортировка
window.sortVpBy = function(field) {
    if (typeof vpSortState === 'undefined') {
        window.vpSortState = { field: 'date', order: 'desc' };
    }
    
    if (vpSortState.field === field) {
        vpSortState.order = vpSortState.order === 'asc' ? 'desc' : 'asc';
    } else {
        vpSortState.field = field;
        vpSortState.order = 'asc';
    }
    
    // Обновляем иконки
    document.querySelectorAll('.vp-table th i').forEach(i => {
        i.className = 'fas fa-sort';
    });
    
    const activeTh = document.querySelector(`.vp-table th[onclick*="${field}"] i`);
    if (activeTh) {
        activeTh.className = vpSortState.order === 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down';
    }
    
    if (typeof renderVpTable === 'function') renderVpTable();
};

// Экспорт в Excel (заглушка, если не определена в vp.js)
if (typeof window.exportVpToExcel !== 'function') {
    window.exportVpToExcel = function() {
        if (typeof showNotif === 'function') {
            showNotif('📊 Экспорт в разработке', 'info');
        } else {
            alert('Экспорт в разработке');
        }
    };
}

// Закрытие модалок по Escape (заглушки)
if (typeof window.closeVpModal !== 'function') {
    window.closeVpModal = function() {
        const modal = document.getElementById('vpModal');
        if (modal) modal.remove();
        document.body.style.overflow = '';
    };
}

if (typeof window.closeBookingDetailsModal !== 'function') {
    window.closeBookingDetailsModal = function() {
        const modal = document.getElementById('bookingDetailsModal');
        if (modal) modal.remove();
        document.body.style.overflow = '';
    };
}

// Инициализация при загрузке
document.addEventListener('DOMContentLoaded', function() {
    // Заполнение селекта админов
    setTimeout(function() {
        const select = document.getElementById('vpAdminFilter');
        if (select && window.app) {
            const employees = window.app.employees || [];
            const profiles = window.app.profiles || {};
            const admins = employees.filter(emp => {
                const role = profiles[emp]?.role;
                return role === 'admin' || role === 'manager';
            });
            
            let options = '<option value="all">Все админы</option>';
            admins.forEach(emp => {
                options += `<option value="${emp}">${emp}</option>`;
            });
            
            select.innerHTML = options;
        }
    }, 500);
    
    // Обработчик Escape для модалок
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (typeof closeVpModal === 'function') closeVpModal();
            if (typeof closeBookingDetailsModal === 'function') closeBookingDetailsModal();
        }
    });
});

// Экспорт функций в глобальную область
window.goToToday = window.goToToday || goToToday;
window.resetVpFilters = window.resetVpFilters || resetVpFilters;
window.filterMyOnly = window.filterMyOnly || filterMyOnly;
window.filterByAdmin = window.filterByAdmin || filterByAdmin;
window.filterByStatus = window.filterByStatus || filterByStatus;
window.sortVpBy = window.sortVpBy || sortVpBy;

console.log('✅ vp.html загружен (глобальные функции определены)');
</script>
