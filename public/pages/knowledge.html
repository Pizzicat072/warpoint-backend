<!-- Полный сброс стилей контента + переопределение -->

<div class="knowledge-container">
    <div class="knowledge-header">
        <div class="header-icon"><i class="fas fa-database"></i></div>
        <h1>База знаний <span>WARPOINT</span></h1>
        <p>Инструкции, правила и полезная информация для сотрудников</p>
    </div>

<script>
// Определяем функцию переключения ДО рендера кнопок
window.switchKnowledgeMode = function(mode) {
    var articleContainer = document.getElementById('knowledgeContainer');
    var toolsContainer = document.getElementById('toolsContainer');
    var actionBar = document.getElementById('actionBar');
    var modeButtons = document.querySelectorAll('.kb-mode-btn');
    
    modeButtons.forEach(function(btn) {
        btn.classList.remove('active');
        if (btn.dataset.mode === mode) btn.classList.add('active');
    });
    
    if (mode === 'articles') {
        if (articleContainer) articleContainer.style.display = 'flex';
        if (toolsContainer) toolsContainer.style.display = 'none';
        if (actionBar) actionBar.style.display = 'flex';
    } else {
        if (articleContainer) articleContainer.style.display = 'none';
        if (actionBar) actionBar.style.display = 'none';
        if (toolsContainer) {
            toolsContainer.style.display = 'grid';
            toolsContainer.classList.add('active');
            if (typeof window.initTools === 'function') {
                window.initTools();
            }
        }
    }
};
</script>

<!-- ПЕРЕКЛЮЧАТЕЛЬ: База знаний / Утилиты -->
<div class="kb-mode-switch">

<!-- ПЕРЕКЛЮЧАТЕЛЬ: База знаний / Утилиты -->
<div class="kb-mode-switch">
    <button class="kb-mode-btn active" data-mode="articles" onclick="window.switchKnowledgeMode('articles')">
        <i class="fas fa-book"></i> База знаний
    </button>
    <button class="kb-mode-btn" data-mode="tools" onclick="window.switchKnowledgeMode('tools')">
        <i class="fas fa-wrench"></i> Утилиты
    </button>
</div>
    <div class="action-bar" id="actionBar">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="knowledgeSearch" placeholder="Поиск по статьям...">
            <button class="clear-search" id="clearSearchBtn" style="display: none;">✕</button>
        </div>
        <div class="action-buttons" id="actionButtons"></div>
    </div>

    <div id="knowledgeContainer" class="knowledge-categories">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
    </div>
</div>
<!-- КОНТЕЙНЕР УТИЛИТ (скрыт по умолчанию) -->
<div id="toolsContainer" style="display:none;">
    <div class="tools-header" style="text-align:center;padding:20px;">
        <p style="color:#94a3b8;">Загрузка утилит...</p>
    </div>
</div>
<script>
(function() {
    var searchInput = document.getElementById('knowledgeSearch');
    var clearBtn = document.getElementById('clearSearchBtn');
    if (searchInput && clearBtn) {
        searchInput.addEventListener('input', function() { clearBtn.style.display = this.value ? 'flex' : 'none'; });
        clearBtn.addEventListener('click', function() { searchInput.value = ''; clearBtn.style.display = 'none'; searchInput.dispatchEvent(new Event('input')); });
    }
    function tryInit() { if (typeof initKnowledge === 'function') { initKnowledge(); } else { setTimeout(tryInit, 100); } }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', tryInit); } else { tryInit(); }
})();
// Функция переключения режимов
window.switchKnowledgeMode = function(mode) {
    var articleContainer = document.getElementById('knowledgeContainer');
    var toolsContainer = document.getElementById('toolsContainer');
    var actionBar = document.getElementById('actionBar');
    var modeButtons = document.querySelectorAll('.kb-mode-btn');
    
    // Обновляем активную кнопку
    modeButtons.forEach(function(btn) {
        btn.classList.remove('active');
        if (btn.dataset.mode === mode) btn.classList.add('active');
    });
    
    if (mode === 'articles') {
        // Показываем статьи
        if (articleContainer) articleContainer.style.display = 'flex';
        if (toolsContainer) toolsContainer.style.display = 'none';
        if (actionBar) actionBar.style.display = 'flex';
    } else {
        // Показываем утилиты
        if (articleContainer) articleContainer.style.display = 'none';
        if (actionBar) actionBar.style.display = 'none';
        if (toolsContainer) {
            toolsContainer.style.display = 'grid';
            toolsContainer.classList.add('active');
            // Загружаем утилиты если ещё не загружены
            if (typeof window.initTools === 'function') {
                window.initTools();
            }
        }
    }
};
</script>

<style>
:root {
    --kb-bg: #0a0c15;
    --kb-surface: rgba(17,20,28,0.6);
    --kb-border: rgba(99,102,241,0.15);
    --kb-accent: #6366f1;
    --kb-accent-light: #a78bfa;

    --kb-text-muted: #94a3b8;
    --kb-gold: #fbbf24;
    --kb-danger: #ef4444;
}

* { box-sizing: border-box; }

.knowledge-container { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; }

    border-radius: 32px; border: 1px solid rgba(99,102,241,0.3); position: relative; overflow: hidden;
}
.knowledge-header::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 40%,rgba(99,102,241,0.06),transparent 60%),
                radial-gradient(circle at 70% 60%,rgba(236,72,153,0.04),transparent 60%);
    pointer-events: none;
}
.header-icon { width: 80px; height: 80px; margin: 0 auto 24px; background: linear-gradient(135deg,var(--kb-accent),#ec4899); border-radius: 24px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; box-shadow: 0 12px 30px rgba(99,102,241,0.3); }
.header-icon i { font-size: 36px; color: white; }
.knowledge-header h1 { font-size: 36px; font-weight: 800; margin: 0 0 16px; position: relative; z-index: 1; color: #f1f5f9; }
.knowledge-header h1 span { background: linear-gradient(135deg,#a78bfa,#ec4899,#f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.knowledge-header p { font-size: 15px; color: var(--kb-text-muted); margin: 0; position: relative; z-index: 1; }

.action-bar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.action-buttons { display: flex; gap: 10px; }

.search-wrapper { position: relative; flex: 2; min-width: 280px; }
.search-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 14px; }
.search-wrapper input { width: 100%; padding: 14px 44px 14px 48px; background: var(--kb-surface); backdrop-filter: blur(12px); border: 1px solid var(--kb-border); border-radius: 40px; color: white; font-size: 14px; transition: all 0.3s; }
.search-wrapper input:focus { outline: none; border-color: var(--kb-accent-light); box-shadow: 0 0 20px rgba(167,139,250,0.15); }
.clear-search { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; background: rgba(255,255,255,0.08); border: none; border-radius: 50%; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.clear-search:hover { background: rgba(239,68,68,0.3); color: #f87171; }

/* Кнопки */
.btn-secondary, .btn-primary, .btn-danger, .btn-create-all {
    padding: 12px 24px; border-radius: 40px; font-weight: 500; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
}
.btn-secondary { background: rgba(255,255,255,0.04); border: 1px solid var(--kb-border); color: var(--kb-text); }
.btn-secondary:hover { background: rgba(99,102,241,0.2); border-color: var(--kb-accent-light); transform: translateY(-2px); }
.btn-primary { background: linear-gradient(135deg,var(--kb-accent),#8b5cf6); border: none; color: white; font-weight: 600; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }
.btn-danger { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }

.btn-create-all { background: linear-gradient(135deg,#10b981,#059669); border: none; color: white; font-weight: 600; font-size: 14px; }
.btn-create-all:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16,185,129,0.4); }

/* Категории */
.knowledge-categories { display: flex; flex-direction: column; gap: 18px; }
.knowledge-category { background: var(--kb-surface); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid var(--kb-border); overflow: hidden; transition: all 0.3s; animation: fadeSlideIn 0.4s ease backwards; }
.knowledge-category:nth-child(1){animation-delay:0.05s}.knowledge-category:nth-child(2){animation-delay:0.10s}.knowledge-category:nth-child(3){animation-delay:0.15s}.knowledge-category:nth-child(4){animation-delay:0.20s}.knowledge-category:nth-child(5){animation-delay:0.25s}.knowledge-category:nth-child(n+6){animation-delay:0.30s}
.knowledge-category:hover { border-color: rgba(99,102,241,0.4); box-shadow: 0 8px 30px rgba(0,0,0,0.3); transform: translateY(-2px); }

.category-title { display: flex; align-items: center; gap: 14px; }
.category-icon { font-size: 32px; width: 48px; height: 48px; background: rgba(99,102,241,0.12); border-radius: 16px; display: flex; align-items: center; justify-content: center; }
.category-name { font-size: 17px; font-weight: 600; color: #f1f5f9; }
.category-count { font-size: 12px; padding: 3px 10px; background: rgba(99,102,241,0.2); border-radius: 20px; color: var(--kb-accent-light); margin-left: 10px; }
.category-actions { display: flex; align-items: center; gap: 6px; }

/* Статьи */
.knowledge-article { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(0,0,0,0.2); border-radius: 16px; cursor: pointer; border: 1px solid transparent; transition: all 0.25s; }
.knowledge-article:hover { background: rgba(99,102,241,0.1); border-color: rgba(99,102,241,0.2); transform: translateX(6px); }
.article-info { flex: 1; }
.article-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; color: #e2e8f0; }
