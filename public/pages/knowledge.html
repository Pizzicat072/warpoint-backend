<div class="knowledge-container">
    <!-- ХЕДЕР -->
    <div class="knowledge-header">
        <div class="header-icon">
            <i class="fas fa-database"></i>
        </div>
        <h1>База знаний <span>WARPOINT</span></h1>
        <p>Инструкции, правила и полезная информация для сотрудников</p>
    </div>

    <!-- ПАНЕЛЬ ДЕЙСТВИЙ -->
    <div class="action-bar" id="actionBar">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="knowledgeSearch" placeholder="Поиск по статьям...">
            <button class="clear-search" id="clearSearchBtn" style="display: none;" aria-label="Очистить поиск">✕</button>
        </div>
        <div class="action-buttons" id="actionButtons">
            <!-- Кнопки добавляются через JS -->
        </div>
    </div>

    <!-- КОНТЕЙНЕР -->
    <div id="knowledgeContainer" class="knowledge-categories">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i> Загрузка...
        </div>
    </div>
</div>

<script>
(function() {
    // Очистка поиска
    var searchInput = document.getElementById('knowledgeSearch');
    var clearBtn = document.getElementById('clearSearchBtn');
    
    if (searchInput && clearBtn) {
        searchInput.addEventListener('input', function() {
            clearBtn.style.display = this.value ? 'flex' : 'none';
        });
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchInput.dispatchEvent(new Event('input'));
        });
    }
    
    function tryInit() {
        if (typeof initKnowledge === 'function') {
            initKnowledge();
        } else {
            setTimeout(tryInit, 100);
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryInit);
    } else {
        tryInit();
    }
})();
</script>
