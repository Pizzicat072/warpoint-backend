<div class="knowledge-container">
    <!-- ХЕДЕР -->
    <div class="knowledge-header">
        <div class="header-icon">
            <i class="fas fa-database"></i>
        </div>
        <h1>База знаний <span>WARPOINT</span></h1>
        <p>Инструкции, правила и полезная информация для сотрудников</p>
    </div>

    <!-- ПАНЕЛЬ ДЕЙСТВИЙ (кнопки будут показаны только если есть права) -->
    <div class="action-bar" id="actionBar">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="knowledgeSearch" placeholder="Поиск по статьям...">
            <button class="clear-search" id="clearSearchBtn" style="display: none;">✕</button>
        </div>
        <div class="action-buttons" id="actionButtons">
            <!-- Кнопки будут добавлены через JS в зависимости от прав -->
        </div>
    </div>

    <!-- КОНТЕЙНЕР КАТЕГОРИЙ -->
    <div id="knowledgeContainer" class="knowledge-categories">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i> Загрузка...
        </div>
    </div>
</div>

<script>
    (function() {
        // Очистка поиска
        const searchInput = document.getElementById('knowledgeSearch');
        const clearBtn = document.getElementById('clearSearchBtn');
        
        if (searchInput && clearBtn) {
            searchInput.addEventListener('input', function() {
                clearBtn.style.display = this.value ? 'flex' : 'none';
            });
            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                clearBtn.style.display = 'none';
                searchInput.dispatchEvent(new Event('input'));
            });
        }
        
        // Добавляем кнопки в зависимости от прав
        function setupActionButtons() {
            const actionButtons = document.getElementById('actionButtons');
            if (!actionButtons) return;
            
            // Проверяем права через глобальные функции (будут доступны после загрузки knowledge.js)
            setTimeout(() => {
                if (typeof window.canManageCategories === 'function' && window.canManageCategories()) {
                    actionButtons.innerHTML = `
                        <button class="btn-secondary" onclick="openCreateCategoryModal()">
                            <i class="fas fa-folder-plus"></i> Новая категория
                        </button>
                        <button class="btn-secondary" onclick="showAddPresetModal()">
                            <i class="fas fa-magic"></i> Готовые категории
                        </button>
                    `;
                } else if (typeof window.canManageArticles === 'function' && window.canManageArticles()) {
                    actionButtons.innerHTML = `
                        <span style="font-size: 12px; color: #64748b;">
                            <i class="fas fa-info-circle"></i> Вы можете добавлять статьи
                        </span>
                    `;
                } else {
                    actionButtons.innerHTML = '';
                }
            }, 200);
        }
        
        function tryInit() {
            if (typeof initKnowledge === 'function') {
                initKnowledge();
                setupActionButtons();
            } else {
                setTimeout(tryInit, 100);
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tryInit);
        } else {
            tryInit();
        }
    })();
</script>
