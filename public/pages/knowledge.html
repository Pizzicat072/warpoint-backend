<!-- public/pages/knowledge.html — БАЗА ЗНАНИЙ + УТИЛИТЫ v5.0 -->
<!-- Всё в одном файле, без внешних зависимостей -->

<div class="knowledge-container">
    
    <!-- ХЕДЕР -->
    <div class="knowledge-header">
        <div class="header-icon"><i class="fas fa-database"></i></div>
        <h1>База знаний <span>WARPOINT</span></h1>
        <p>Инструкции, правила и полезная информация для сотрудников</p>
    </div>

    <!-- ПЕРЕКЛЮЧАТЕЛЬ -->
    <div class="kb-mode-switch">
        <button class="kb-mode-btn active" id="btnArticles" onclick="switchTab('articles')">
            <i class="fas fa-book"></i> База знаний
        </button>
        <button class="kb-mode-btn" id="btnTools" onclick="switchTab('tools')">
            <i class="fas fa-wrench"></i> Утилиты
        </button>
    </div>

    <!-- ========== ВКЛАДКА: БАЗА ЗНАНИЙ ========== -->
    <div id="tabArticles">
        <div class="action-bar">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="knowledgeSearch" placeholder="Поиск по статьям...">
                <button class="clear-search" id="clearSearchBtn" style="display:none;">✕</button>
            </div>
            <div class="action-buttons" id="actionButtons"></div>
        </div>
        <div id="knowledgeContainer" class="knowledge-categories">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Загрузка статей...</div>
        </div>
    </div>

    <!-- ========== ВКЛАДКА: УТИЛИТЫ ========== -->
    <div id="tabTools" style="display:none;">
        <div class="tools-top-bar">
            <div class="tools-stats">
                <div class="tools-stat">
                    <span class="tools-stat-value" id="toolsCount">0</span>
                    <span class="tools-stat-label">Утилит</span>
                </div>
                <div class="tools-stat">
                    <span class="tools-stat-value" id="toolsTotalSize">0 KB</span>
                    <span class="tools-stat-label">Общий размер</span>
                </div>
            </div>
            <button class="btn-primary" id="uploadToolBtn">
                <i class="fas fa-plus"></i> Добавить утилиту
            </button>
        </div>
        
        <div class="tools-filter-bar">
            <input type="text" id="toolsSearch" placeholder="Поиск утилит..." class="tools-search-input">
            <select id="toolsFilterType" class="tools-filter-select">
                <option value="all">Все типы</option>
                <option value="exe">💻 Программы</option>
                <option value="msi">📦 Установщики</option>
                <option value="url">🌐 Ссылки</option>
                <option value="other">📁 Другое</option>
            </select>
        </div>
        
        <div id="toolsGrid" class="tools-grid-container">
            <div style="text-align:center;padding:40px;grid-column:1/-1;color:#94a3b8;">
                <i class="fas fa-spinner fa-spin"></i> Загрузка...
            </div>
        </div>
    </div>

</div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ УТИЛИТЫ -->
<div id="uploadToolModal" class="modal" style="display:none;">
    <div class="modal-window" style="max-width:520px;">
        <div class="modal-header">
            <div class="modal-icon"><i class="fas fa-wrench"></i></div>
            <div class="modal-title">
                <h3>Добавить утилиту</h3>
                <p>Загрузите файл или укажите ссылку</p>
            </div>
            <button class="modal-close" onclick="closeUploadToolModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Название</label>
                <input type="text" id="toolName" class="form-input" placeholder="Название утилиты">
            </div>
            <div class="form-group">
                <label><i class="fas fa-align-left"></i> Описание</label>
                <textarea id="toolDesc" class="form-textarea" rows="3" placeholder="Краткое описание..."></textarea>
            </div>
            <div class="form-group">
                <label><i class="fas fa-folder"></i> Тип</label>
                <select id="toolType" class="form-select" onchange="toggleToolInput()">
                    <option value="exe">💻 Программа (.exe)</option>
                    <option value="msi">📦 Установщик (.msi)</option>
                    <option value="bat">📜 Скрипт (.bat, .cmd)</option>
                    <option value="other">📁 Другой файл</option>
                    <option value="url">🌐 Ссылка</option>
                </select>
            </div>
            <div class="form-group" id="toolFileGroup">
                <label><i class="fas fa-upload"></i> Файл</label>
                <div class="tool-upload-area" id="toolDropZone">
                    <i class="fas fa-cloud-upload-alt" style="font-size:32px;color:#64748b;margin-bottom:8px;"></i>
                    <p style="color:#94a3b8;margin:4px 0;">Перетащите файл сюда или</p>
                    <label class="btn-secondary" style="cursor:pointer;margin-top:8px;">
                        Выберите файл
                        <input type="file" id="toolFile" style="display:none;" onchange="updateFileName(this)">
                    </label>
                    <p id="toolFileName" style="color:#a78bfa;margin-top:8px;font-size:12px;display:none;"></p>
                </div>
            </div>
            <div class="form-group" id="toolUrlGroup" style="display:none;">
                <label><i class="fas fa-link"></i> Ссылка</label>
                <input type="text" id="toolPath" class="form-input" placeholder="https://...">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeUploadToolModal()">Отмена</button>
            <button class="btn-primary" onclick="addTool()">💾 Добавить</button>
        </div>
    </div>
</div>
<script>
// ============================================
// ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ============================================

function switchTab(tab) {
    var btnA = document.getElementById('btnArticles');
    var btnT = document.getElementById('btnTools');
    var tabA = document.getElementById('tabArticles');
    var tabT = document.getElementById('tabTools');
    
    if (tab === 'articles') {
        btnA.classList.add('active');
        btnT.classList.remove('active');
        tabA.style.display = 'block';
        tabT.style.display = 'none';
        if (typeof renderKnowledge === 'function') renderKnowledge();
    } else {
        btnT.classList.add('active');
        btnA.classList.remove('active');
        tabA.style.display = 'none';
        tabT.style.display = 'block';
        loadToolsData();
    }
}

// ============================================
// УТИЛИТЫ — ЗАГРУЗКА
// ============================================

var toolsList = [];
var toolsLoaded = false;

function loadToolsData() {
    if (toolsLoaded) {
        renderToolsGrid();
        updateToolsStats();
        return;
    }
    
    var grid = document.getElementById('toolsGrid');
    grid.innerHTML = '<div style="text-align:center;padding:40px;grid-column:1/-1;"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>';
    
    var token = localStorage.getItem('token') || localStorage.getItem('warpoint_token') || '';
    
    fetch('/api/tools', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        toolsList = [];
        
        // Файлы с сервера
        if (data && data.tools && data.tools.length > 0) {
            data.tools.forEach(function(f) {
                var ext = getFileExt(f.name);
                toolsList.push({
                    id: 'f_' + f.name,
                    name: cleanName(f.name),
                    desc: 'Загружен ' + formatDate(f.uploadedAt),
                    type: ext,
                    icon: getIcon(ext),
                    path: f.path,
                    size: f.size,
                    uploadedAt: f.uploadedAt,
                    isServer: true
                });
            });
        }
        
        // Ссылки из localStorage
        try {
            var saved = JSON.parse(localStorage.getItem('warpoint_tools_links') || '[]');
            saved.forEach(function(s) {
                toolsList.push({
                    id: s.id || 'l_' + Date.now(),
                    name: s.name,
                    desc: s.desc || s.path,
                    type: 'url',
                    icon: '🌐',
                    path: s.path,
                    size: 0,
                    isServer: false
                });
            });
        } catch(e) {}
        
        toolsLoaded = true;
        renderToolsGrid();
        updateToolsStats();
    })
    .catch(function() {
        grid.innerHTML = '<div style="text-align:center;padding:40px;grid-column:1/-1;color:#ef4444;">❌ Ошибка загрузки</div>';
    });
}

// ============================================
// УТИЛИТЫ — РЕНДЕР
// ============================================

function renderToolsGrid() {
    var grid = document.getElementById('toolsGrid');
    if (!grid) return;
    
    var search = (document.getElementById('toolsSearch')?.value || '').toLowerCase();
    var filterType = document.getElementById('toolsFilterType')?.value || 'all';
    
    var filtered = toolsList.filter(function(t) {
        var matchSearch = !search || t.name.toLowerCase().indexOf(search) !== -1;
        var matchType = filterType === 'all' || t.type === filterType || (filterType === 'other' && ['exe','msi','bat','url'].indexOf(t.type) === -1);
        return matchSearch && matchType;
    });
    
    if (filtered.length === 0) {
        grid.innerHTML = '<div style="text-align:center;padding:60px 20px;grid-column:1/-1;">' +
            '<div style="font-size:64px;margin-bottom:16px;">📭</div>' +
            '<div style="font-size:18px;font-weight:600;color:#e2e8f0;margin-bottom:8px;">Нет утилит</div>' +
            '<div style="font-size:14px;color:#94a3b8;">Загрузите файл или добавьте ссылку</div>' +
        '</div>';
        return;
    }
    
    var html = '';
    filtered.forEach(function(t) {
        var badge = t.isServer ? '<span class="tool-badge badge-server">📁 Файл</span>' : '<span class="tool-badge badge-link">🔗 Ссылка</span>';
        var sizeStr = t.size ? formatSize(t.size) : '';
        var typeStr = t.type ? t.type.toUpperCase() : 'ФАЙЛ';
        var actionBtn = '';
        
        if (t.isServer) {
            actionBtn = '<a href="' + t.path + '" download class="btn-launch">📥 Скачать</a>';
        } else {
            actionBtn = '<a href="' + escapeHTML(t.path) + '" target="_blank" rel="noopener" class="btn-launch btn-launch-link">🔗 Открыть</a>';
        }
        
        html += '<div class="tool-card">' +
            '<div class="tool-card-top">' +
                '<div class="tool-card-icon">' + (t.icon || '📁') + '</div>' +
                '<div class="tool-card-badges">' + badge + '</div>' +
            '</div>' +
            '<div class="tool-card-body">' +
                '<div class="tool-card-name">' + escapeHTML(t.name) + '</div>' +
                '<div class="tool-card-desc">' + escapeHTML(t.desc || '') + '</div>' +
                '<div class="tool-card-meta">' +
                    '<span>' + typeStr + '</span>' +
                    (sizeStr ? '<span> • ' + sizeStr + '</span>' : '') +
                '</div>' +
            '</div>' +
            '<div class="tool-card-actions">' +
                actionBtn +
                '<button class="btn-delete-tool" onclick="deleteTool(\'' + t.id + '\')" title="Удалить">🗑️</button>' +
            '</div>' +
        '</div>';
    });
    
    grid.innerHTML = html;
}

function updateToolsStats() {
    document.getElementById('toolsCount').textContent = toolsList.length;
    var totalSize = toolsList.reduce(function(s, t) { return s + (t.size || 0); }, 0);
    document.getElementById('toolsTotalSize').textContent = formatSize(totalSize);
}

// ============================================
// УТИЛИТЫ — ДОБАВЛЕНИЕ
// ============================================

function toggleToolInput() {
    var type = document.getElementById('toolType').value;
    var fileGroup = document.getElementById('toolFileGroup');
    var urlGroup = document.getElementById('toolUrlGroup');
    
    if (type === 'url') {
        fileGroup.style.display = 'none';
        urlGroup.style.display = 'block';
    } else {
        fileGroup.style.display = 'block';
        urlGroup.style.display = 'none';
    }
}

function updateFileName(input) {
    var nameEl = document.getElementById('toolFileName');
    if (input.files && input.files[0]) {
        nameEl.textContent = '📎 ' + input.files[0].name + ' (' + formatSize(input.files[0].size) + ')';
        nameEl.style.display = 'block';
    }
}

function openUploadToolModal() {
    var modal = document.getElementById('uploadToolModal');
    if (!modal) return;
    modal.style.display = 'flex';
    
    document.getElementById('toolName').value = '';
    document.getElementById('toolDesc').value = '';
    document.getElementById('toolPath').value = '';
    document.getElementById('toolType').value = 'exe';
    document.getElementById('toolFile').value = '';
    document.getElementById('toolFileName').style.display = 'none';
    toggleToolInput();
}

function closeUploadToolModal() {
    var modal = document.getElementById('uploadToolModal');
    if (modal) modal.style.display = 'none';
}

function addTool() {
    var name = document.getElementById('toolName').value.trim();
    var desc = document.getElementById('toolDesc').value.trim();
    var type = document.getElementById('toolType').value;
    
    if (!name) { showNotif('❌ Введите название', 'error'); return; }
    
    // Ссылка
    if (type === 'url') {
        var url = document.getElementById('toolPath').value.trim();
        if (!url) { showNotif('❌ Введите ссылку', 'error'); return; }
        
        toolsList.push({
            id: 'l_' + Date.now(),
            name: name,
            desc: desc || url,
            type: 'url',
            icon: '🌐',
            path: url,
            size: 0,
            isServer: false
        });
        
        saveLinks();
        renderToolsGrid();
        updateToolsStats();
        closeUploadToolModal();
        showNotif('✅ Ссылка добавлена', 'success');
        return;
    }
    
    // Файл
    var file = document.getElementById('toolFile').files[0];
    if (!file) { showNotif('❌ Выберите файл', 'error'); return; }
    
    showNotif('⏳ Загрузка...', 'info');
    
    var fd = new FormData();
    fd.append('file', file);
    
    fetch('/api/tools/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') },
        body: fd
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data && data.success) {
            var ext = getFileExt(data.file.name);
            toolsList.push({
                id: 'f_' + data.file.path,
                name: name,
                desc: desc || formatSize(data.file.size),
                type: ext,
                icon: getIcon(ext),
                path: data.file.path,
                size: data.file.size,
                uploadedAt: new Date().toISOString(),
                isServer: true
            });
            
            renderToolsGrid();
            updateToolsStats();
            closeUploadToolModal();
            showNotif('✅ Файл загружен: ' + file.name, 'success');
        } else {
            showNotif('❌ ' + ((data && data.error) || 'Ошибка'), 'error');
        }
    })
    .catch(function() {
        showNotif('❌ Ошибка загрузки', 'error');
    });
}

// ============================================
// УТИЛИТЫ — УДАЛЕНИЕ
// ============================================

function deleteTool(id) {
    if (!confirm('Удалить эту утилиту?')) return;
    
    var tool = toolsList.find(function(t) { return t.id === id; });
    if (!tool) return;
    
    if (tool.isServer) {
        var filename = tool.path.split('/').pop();
        fetch('/api/tools/' + encodeURIComponent(filename), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') }
        });
    }
    
    toolsList = toolsList.filter(function(t) { return t.id !== id; });
    saveLinks();
    renderToolsGrid();
    updateToolsStats();
    showNotif('🗑️ Утилита удалена', 'info');
}

function saveLinks() {
    var links = toolsList.filter(function(t) { return !t.isServer; });
    localStorage.setItem('warpoint_tools_links', JSON.stringify(links));
}
<script>
// ============================================
// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================

function getFileExt(filename) {
    var parts = filename.split('.');
    return parts.length > 1 ? parts.pop().toLowerCase() : '';
}

function cleanName(filename) {
    return filename.replace(/_\d{13}\./, '.');
}

function getIcon(ext) {
    var icons = {
        exe: '💻', msi: '📦', bat: '📜', cmd: '⬛', ps1: '⚡',
        zip: '📚', rar: '📚', '7z': '📚',
        pdf: '📄', doc: '📝', docx: '📝', xls: '📊', ppt: '📽️',
        png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️',
        mp4: '🎬', mp3: '🎵',
        iso: '💿', apk: '📱', dll: '⚙️', sys: '⚙️',
        txt: '📃', csv: '📊', json: '📋', xml: '📋',
        url: '🌐'
    };
    return icons[ext] || '📁';
}

function formatSize(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
    return (bytes / 1073741824).toFixed(1) + ' GB';
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function escapeHTML(str) {
    if (!str) return '';
    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
}

function showNotif(msg, type) {
    if (typeof window.showSystemNotification === 'function') {
        window.showSystemNotification(msg, type);
    } else if (typeof window.showNotif === 'function') {
        window.showNotif(msg, type);
    } else {
        console.log('[' + type + '] ' + msg);
    }
}

// ============================================
// НАЗНАЧЕНИЕ СОБЫТИЙ
// ============================================

document.addEventListener('DOMContentLoaded', function() {
    // Кнопка "Добавить утилиту"
    var uploadBtn = document.getElementById('uploadToolBtn');
    if (uploadBtn) {
        uploadBtn.addEventListener('click', openUploadToolModal);
    }
    
    // Поиск по утилитам
    var searchInput = document.getElementById('toolsSearch');
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            renderToolsGrid();
        });
    }
    
    // Фильтр по типу
    var filterSelect = document.getElementById('toolsFilterType');
    if (filterSelect) {
        filterSelect.addEventListener('change', function() {
            renderToolsGrid();
        });
    }
    
    // Drag & drop для файлов
    var dropZone = document.getElementById('toolDropZone');
    if (dropZone) {
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#a78bfa';
            this.style.background = 'rgba(99,102,241,0.1)';
        });
        
        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = 'rgba(99,102,241,0.2)';
            this.style.background = 'transparent';
        });
        
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = 'rgba(99,102,241,0.2)';
            this.style.background = 'transparent';
            
            var files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('toolFile').files = files;
                updateFileName(document.getElementById('toolFile'));
            }
        });
    }
    
    // Клик по dropZone = открыть выбор файла
    if (dropZone) {
        dropZone.addEventListener('click', function() {
            document.getElementById('toolFile').click();
        });
    }
    
    // Закрытие модалки по Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeUploadToolModal();
        }
    });
});

// Загрузка при старте
(function() {
    // Ждём токен и загружаем утилиты в фоне
    var attempts = 0;
    var maxAttempts = 30;
    var interval = setInterval(function() {
        attempts++;
        if (localStorage.getItem('token') || localStorage.getItem('warpoint_token')) {
            clearInterval(interval);
            loadToolsData();
        } else if (attempts >= maxAttempts) {
            clearInterval(interval);
        }
    }, 200);
})();

// ============================================
// ПОИСК ДЛЯ БАЗЫ ЗНАНИЙ
// ============================================

(function() {
    var searchInput = document.getElementById('knowledgeSearch');
    var clearBtn = document.getElementById('clearSearchBtn');
    if (searchInput && clearBtn) {
        searchInput.addEventListener('input', function() {
            clearBtn.style.display = this.value ? 'flex' : 'none';
        });
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchInput.dispatchEvent(new Event('input'));
        });
    }
    
    function tryInit() {
        if (typeof initKnowledge === 'function') {
            initKnowledge();
        } else {
            setTimeout(tryInit, 100);
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryInit);
    } else {
        tryInit();
    }
})();
</script>
<style>
/* ============================================ */
/* KNOWLEDGE v5.0 — БАЗА ЗНАНИЙ + УТИЛИТЫ      */
/* ============================================ */

:root {
    --kb-bg: #0a0c15;
    --kb-surface: rgba(17,20,28,0.6);
    --kb-border: rgba(99,102,241,0.15);
    --kb-accent: #6366f1;
    --kb-accent-light: #a78bfa;
    --kb-text: #e2e8f0;
    --kb-text-muted: #94a3b8;
    --kb-text-dim: #64748b;
    --kb-gold: #fbbf24;
    --kb-danger: #ef4444;
    --kb-success: #10b981;
}

* { box-sizing: border-box; }

.knowledge-container { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; }

/* Хедер */
.knowledge-header {
    text-align: center; margin-bottom: 28px; padding: 48px 24px;
    background: linear-gradient(135deg,rgba(20,25,50,0.6),rgba(15,18,35,0.4));
    border-radius: 32px; border: 1px solid rgba(99,102,241,0.3); position: relative; overflow: hidden;
}
.knowledge-header::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 40%,rgba(99,102,241,0.06),transparent 60%),
                radial-gradient(circle at 70% 60%,rgba(236,72,153,0.04),transparent 60%);
