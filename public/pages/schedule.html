<script>
// ГЛОБАЛЬНЫЕ ФУНКЦИИ ДЛЯ ГРАФИКА
window.toggleMyShiftsFilter = function() {
    var checkbox = document.getElementById('filterMyShifts');
    if (typeof myShiftsOnly !== 'undefined') {
        myShiftsOnly = checkbox ? checkbox.checked : false;
    }
    if (typeof renderMonthSchedule === 'function') renderMonthSchedule();
};

window.toggleOperatorsFilter = function() {
    var checkbox = document.getElementById('filterOperatorsOnly');
    if (typeof operatorsOnly !== 'undefined') {
        operatorsOnly = checkbox ? checkbox.checked : false;
    }
    if (typeof renderMonthSchedule === 'function') renderMonthSchedule();
};

window.resetScheduleFilters = function() {
    var myCheckbox = document.getElementById('filterMyShifts');
    var opCheckbox = document.getElementById('filterOperatorsOnly');
    if (myCheckbox) myCheckbox.checked = false;
    if (opCheckbox) opCheckbox.checked = false;
    if (typeof myShiftsOnly !== 'undefined') myShiftsOnly = false;
    if (typeof operatorsOnly !== 'undefined') operatorsOnly = false;
    if (typeof renderMonthSchedule === 'function') renderMonthSchedule();
    if (typeof showNotif === 'function') showNotif('Фильтры сброшены', 'info');
};

window.exportSchedule = function() {
    if (typeof showNotif === 'function') {
        showNotif('📊 Экспорт в разработке', 'info');
    } else {
        alert('Экспорт в разработке');
    }
};
</script>
