<!-- public/pages/shop.html - КОМПАКТНЫЙ ИСПРАВЛЕННЫЙ -->
<div class="shop-container">
    <!-- Шапка -->
    <div class="shop-header">
        <div class="shop-title">
            <div class="shop-icon">🛒</div>
            <div>
                <h1>WARPOINT MARKET</h1>
                <p>Подарки, аватары и статусы</p>
            </div>
        </div>
        <div class="shop-balance">
            <div class="balance-label">МОЙ БАЛАНС</div>
            <div class="balance-value" id="userCoinsAmount">0</div>
            <div class="balance-currency">WP</div>
        </div>
    </div>

    <!-- Табы -->
    <div class="shop-tabs">
        <button class="shop-tab active" data-tab="gifts">🎁 Подарки</button>
        <button class="shop-tab" data-tab="avatars">👤 Аватары</button>
        <button class="shop-tab" data-tab="statuses">🏷️ Статусы</button>
    </div>

    <!-- Подарки -->
    <div id="giftsTab" class="shop-tab-content active">
        <div id="giftsContainer" class="shop-grid"></div>
    </div>

    <!-- Аватары -->
    <div id="avatarsTab" class="shop-tab-content" style="display: none;">
        <div id="avatarsContainer" class="shop-grid"></div>
    </div>

    <!-- Статусы -->
    <div id="statusesTab" class="shop-tab-content" style="display: none;">
        <div class="section-header">
            <h3>✨ Доступные статусы</h3>
        </div>
        <div id="statusesContainer" class="shop-grid"></div>

        <div class="section-header" style="margin-top: 32px;">
            <h3>📦 Инвентарь</h3>
        </div>
        <div id="inventoryContainer" class="shop-grid"></div>
    </div>
</div>

<!-- Модалка подарка -->
<div id="giftModal" class="modal" style="display: none;">
    <div class="modal-window" style="max-width: 400px;">
        <div style="padding: 20px; border-bottom: 1px solid rgba(99,102,241,0.15); display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;">🎁 Отправить подарок</h3>
            <button onclick="closeGiftModal()" style="background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer;">&times;</button>
        </div>
        <div style="padding: 20px;">
            <select id="giftRecipient" class="edit-input" style="margin-bottom: 16px;">
                <option value="">Выберите сотрудника</option>
            </select>
            <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 16px;">
                <button onclick="changeQuantity(-1)" style="width: 36px; height: 36px; background: #6366f1; border: none; border-radius: 50%; color: white; cursor: pointer;">-</button>
                <span id="giftQuantity" style="font-size: 24px; font-weight: 700;">1</span>
                <button onclick="changeQuantity(1)" style="width: 36px; height: 36px; background: #6366f1; border: none; border-radius: 50%; color: white; cursor: pointer;">+</button>
            </div>
            <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px; cursor: pointer;">
                <input type="checkbox" id="giftAnonymous" onchange="toggleAnonymous(this.checked)">
                <span>🕵️ Отправить анонимно</span>
            </label>
            <div style="display: flex; justify-content: space-between; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 12px; margin-bottom: 20px;">
                <span>Итого:</span>
                <span id="totalPrice" style="font-size: 22px; color: #fbbf24; font-weight: 700;">0 WP</span>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button class="btn-secondary" onclick="closeGiftModal()">Отмена</button>
                <button class="btn-primary" onclick="sendGift()">Отправить</button>
            </div>
        </div>
    </div>
</div>
