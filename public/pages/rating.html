<!-- public/pages/rating.html -->
<div class="rating-page">
    
    <!-- ГЛАВНЫЙ ГЕРОЙ -->
    <div class="rating-hero">
        <div class="rating-hero-bg"></div>
        <div class="rating-hero-content">
            <div class="rating-hero-icon">
                <i class="fas fa-trophy"></i>
                <div class="hero-icon-pulse"></div>
            </div>
            <div class="rating-hero-text">
                <h1>Рейтинг и достижения</h1>
                <p>Соревнуйтесь с коллегами и открывайте новые достижения</p>
            </div>
            <div class="rating-hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-value" id="totalEmployees">0</div>
                    <div class="hero-stat-label">сотрудников</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value" id="totalAchievements">0</div>
                    <div class="hero-stat-label">достижений</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value" id="userRank">⭐</div>
                    <div class="hero-stat-label">ваше звание</div>
                </div>
            </div>
        </div>
    </div>

    <!-- РЕЙТИНГ -->
    <div class="rating-section">
        <div class="section-header">
            <div class="section-icon">🏆</div>
            <h2>Рейтинг сотрудников</h2>
            <div class="section-line"></div>
        </div>
        
        <div class="rating-controls">
            <div class="rating-search">
                <i class="fas fa-search"></i>
                <input type="text" id="ratingSearch" placeholder="Поиск сотрудника...">
            </div>
            <div class="rating-sort">
                <select id="ratingSort">
                    <option value="rating">По рейтингу</option>
                    <option value="coins">По монетам</option>
                    <option value="hours">По часам</option>
                    <option value="name">По имени</option>
                </select>
            </div>
            <div class="rating-order">
                <button class="order-btn active" data-order="desc" onclick="changeRatingOrder('desc')">
                    <i class="fas fa-arrow-down"></i> По убыванию
                </button>
                <button class="order-btn" data-order="asc" onclick="changeRatingOrder('asc')">
                    <i class="fas fa-arrow-up"></i> По возрастанию
                </button>
            </div>
        </div>

        <div class="rating-table-wrapper">
            <table class="rating-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Сотрудник</th>
                        <th>Часы</th>
                        <th>⭐ Рейтинг</th>
                        <th>💰 Монеты</th>
                        <th>🏆 Звание</th>
                        <th>🎯 Достижения</th>
                    </tr>
                </thead>
                <tbody id="ratingTableBody">
                    <tr><td colspan="7" class="loading-cell"><i class="fas fa-spinner fa-spin"></i> Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ДОСТИЖЕНИЯ -->
    <div class="rating-section">
        <div class="section-header">
            <div class="section-icon">🎖️</div>
            <h2>Достижения</h2>
            <div class="section-line"></div>
        </div>
        <div id="achievementsContainer" class="achievements-container">
            <div class="loading-achievements"><i class="fas fa-spinner fa-spin"></i> Загрузка достижений...</div>
        </div>
    </div>
</div>

<style>

.rating-hero-bg { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(99, 102, 241, 0.15), transparent 70%); animation: heroGlow 8s ease-in-out infinite; }

.rating-hero-stats { display: flex; gap: 32px; }

.hero-stat-value { font-size: 28px; font-weight: 800; color: #fbbf24; line-height: 1; }

.rating-search { display: flex; align-items: center; gap: 10px; background: #0d1016; border: 1px solid #1e2430; border-radius: 40px; padding: 8px 18px; }
.rating-search i { color: #64748b; font-size: 14px; }
.rating-search input { background: transparent; border: none; color: #e2e8f0; font-size: 13px; width: 220px; outline: none; }
.rating-sort select { background: #0d1016; border: 1px solid #1e2430; border-radius: 40px; padding: 8px 20px; color: #e2e8f0; font-size: 13px; cursor: pointer; outline: none; }
.rating-order { display: flex; gap: 10px; }
.order-btn { background: #0d1016; border: 1px solid #1e2430; border-radius: 30px; padding: 8px 20px; color: #94a3b8; cursor: pointer; transition: all 0.2s; font-size: 12px; }
