<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WARPOINT — Хаб сотрудников</title>
    <link rel="icon" type="image/jpeg" href="https://h.careers/_next/image?url=https%3A%2F%2Fimg.hhcdn.ru%2Femployer-logo-original-round%2F6361685.jpeg&w=1920&q=75">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* ===== ПРЕЛОАДЕР ===== */
        #globalLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0c12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #globalLoader.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .loader-content {
            text-align: center;
        }
        .loader-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            animation: loaderPulse 1.5s ease-in-out infinite;
        }
        .loader-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }
        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: loaderSpin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes loaderSpin {
            to { transform: rotate(360deg); }
        }
        .loader-text {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 16px;
        }
        .loader-progress {
            width: 200px;
            height: 3px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 3px;
            margin: 20px auto 0;
            overflow: hidden;
        }
        .loader-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
            border-radius: 3px;
            animation: loaderProgress 2.5s ease-in-out forwards;
        }
        @keyframes loaderProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/2026-04-02_03-45-56.png') center/cover no-repeat;
            filter: brightness(0.4) saturate(0.8);
            z-index: -2;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }
        #loginModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            padding: 20px;
        }
        .login-card {
            width: 400px;
            max-width: 100%;
            padding: 48px 40px;
            background: rgba(18, 24, 34, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: cardAppear 0.5s ease-out;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-logo-clean {
            width: 100px;
            height: 100px;
            margin: 0 auto 32px;
            background: transparent;
        }
        .login-logo-clean img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }
        .login-brand-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-brand-sub {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 40px;
        }
        .login-field {
            position: relative;
            margin-bottom: 16px;
        }
        .login-field i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        .login-field input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .login-field input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .login-submit-btn {
            width: 100%;
            padding: 14px 20px;
            margin-top: 32px;
            background: #6366f1;
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .login-submit-btn:hover {

        }
        .login-footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;

            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #mainContainer {
            position: relative;
            z-index: 10;
            min-height: 100vh;
        }
        #syncIndicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;

            align-items: center;

            z-index: 9998;

        #syncIndicator i {

        #syncIndicator.connecting i {

        .header {

            align-items: center;
            padding: 16px 32px;
            background: rgba(11, 14, 20, 0.8);

            top: 0;

        }
        .logo-area {

            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            overflow: hidden;
        }
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-text {
            font-size: 22px;
            font-weight: 700;
        }
        .logo-badge {
            background: #6366f1;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: 8px;
        }
        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 40px;
            padding: 4px 16px 4px 8px;
        }
        .user-avatar {

            height: 36px;
            background: #2d3748;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .user-avatar img {

        }

        .user-status {

            color: #9ca3af;
        }

            color: #f87171;

            font-size: 11px;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        .notifications-icon {
            position: relative;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
        }
        .notifications-icon .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 600;
            min-width: 16px;
            height: 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .notifications-dropdown {
            position: absolute;
            top: 60px;
            right: 20px;
            width: 360px;
            max-height: 400px;
            background: #131720;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            overflow: hidden;
            display: none;
        }
        .notifications-dropdown.show {
            display: block;
        }
        .main-menu {
            background: rgba(11, 14, 20, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: sticky;
            top: 72px;
            z-index: 999;
            padding: 0 16px;
            overflow-x: auto;
        }
        .menu-container {
            display: flex;
            align-items: center;
            gap: 4px;

            margin: 0 auto;
            padding: 8px 0;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            cursor: pointer;
            white-space: nowrap;
        }
        .menu-item i {
            font-size: 18px;
            color: #9ca3af;
        }
        .menu-item .menu-tooltip {
            font-size: 10px;
            color: #9ca3af;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .menu-item.active {
            background: rgba(99, 102, 241, 0.1);
        }
        .menu-item.active i,
        .menu-item.active .menu-tooltip {
            color: #818cf8;
        }
        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .logo-text { font-size: 18px; }
            .user-info { display: none; }
            .main-menu { top: 60px; }
            .menu-item .menu-tooltip { display: none; }
            .notifications-dropdown { width: calc(100% - 40px); right: 20px; left: 20px; }
            .login-card { padding: 36px 28px; }
        }
    </style>
</head>

<script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>

<script>
    const PUSHER_KEY = '91e6eb7093c4b16a3275';
    const PUSHER_CLUSTER = 'ap1';
    const CHANNEL_NAME = 'private-warpoint-sync';
    
    let pusherInitAttempts = 0;
    const MAX_PUSHER_ATTEMPTS = 5;
    let isPusherInitializing = false;
    let pusherReconnectTimer = null;
    
    // 🔥 РЕАЛЬНЫЙ ПРЕЛОАДЕР
    const requiredModules = [
        'utils.js', 'api.js', 'achievements.js', 'auth.js', 'router.js',
        'dashboard.js', 'employees.js', 'schedule.js', 'tasks.js', 'shop.js',
        'rating.js', 'notifications.js', 'fines.js', 'chat.js', 'knowledge.js',
        'vp.js', 'salary.js', 'admin.js', 'reports.js'
    ];
    
    let loadedModules = 0;
    const loaderStatus = document.getElementById('loaderStatus');
    const loaderProgressBar = document.getElementById('loaderProgressBar');
    
    function updateLoaderProgress() {
        loadedModules++;
        const percent = Math.round((loadedModules / requiredModules.length) * 100);
        if (loaderStatus) loaderStatus.textContent = `Загрузка модулей... ${loadedModules}/${requiredModules.length}`;
        if (loaderProgressBar) loaderProgressBar.style.width = percent + '%';
    }
    
    document.querySelectorAll('script[src*="/js/"]').forEach(script => {
        script.addEventListener('load', updateLoaderProgress);
        script.addEventListener('error', () => console.error('❌ Ошибка загрузки:', script.src));
    });
    
    window.addEventListener('load', function() {
        setTimeout(() => {
            const loader = document.getElementById('globalLoader');
            if (loader) {
                loader.classList.add('fade-out');
                setTimeout(() => loader.remove(), 400);
            }
        }, 600);
    });
    
    function transliterateForChannel(name) {
        const ru = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
        let result = '';
        for (let i = 0; i < name.length; i++) {
            const char = name[i];
            if (ru[char]) result += ru[char];
            else if (char.match(/[a-zA-Z0-9]/)) result += char.toLowerCase();
        }
        result = result.replace(/[^a-z0-9]/g, '');
        const defaultNames = {'Денис':'denis','Андрей':'andrey','Максим':'maxim'};
        if (result === '' || result.length < 3) result = defaultNames[name] || 'user';
        return result;
    }
    
    function initPusher() {
        if (isPusherInitializing) return;
        
        const token = localStorage.getItem('token');
        if (!token) return;
        
        const syncIndicator = document.getElementById('syncIndicator');
        if (syncIndicator) {
            syncIndicator.classList.remove('online');
            syncIndicator.classList.add('connecting');
        }
        
        if (window.pusher && window.pusher.connection?.state === 'connected') {
            if (syncIndicator) {
                syncIndicator.classList.add('online');
                syncIndicator.classList.remove('connecting');
            }
            return;
        }
        
        isPusherInitializing = true;
        
        try {
            if (window.pusher) window.pusher.disconnect();
            
            window.pusher = new Pusher(PUSHER_KEY, {
                cluster: PUSHER_CLUSTER,
                forceTLS: true,
                authEndpoint: '/api/pusher/auth',
                auth: { headers: { 'Authorization': 'Bearer ' + token } }
            });
            
            window.channel = window.pusher.subscribe(CHANNEL_NAME);
            
            const currentUser = window.app?.currentUser;
            if (currentUser) {
                window.privateChannel = window.pusher.subscribe('private-user-' + transliterateForChannel(currentUser));
            }
            
            window.pusher.connection.bind('connected', () => {
                console.log('🟢 Pusher подключён');
                if (syncIndicator) {
                    syncIndicator.classList.add('online');
                    syncIndicator.classList.remove('connecting');
                }
                pusherInitAttempts = 0;
                isPusherInitializing = false;
                if (pusherReconnectTimer) {
                    clearTimeout(pusherReconnectTimer);
                    pusherReconnectTimer = null;
                }
            });
            
            window.pusher.connection.bind('disconnected', () => {
                console.log('🔴 Pusher отключён');
                if (syncIndicator) syncIndicator.classList.remove('online', 'connecting');
                isPusherInitializing = false;
                schedulePusherReconnect();
            });
            
            window.pusher.connection.bind('error', (err) => {
                console.error('❌ Pusher error:', err);
                if (syncIndicator) syncIndicator.classList.remove('online', 'connecting');
                isPusherInitializing = false;
                schedulePusherReconnect();
            });
            
            window.channel.bind('schedule-updated', (data) => {
                if (typeof loadScheduleData === 'function') loadScheduleData();
                if (typeof updateNextShiftInfo === 'function') updateNextShiftInfo();
                if (typeof updateDashboardStats === 'function') updateDashboardStats();
                if (typeof renderEmployees === 'function') renderEmployees();
                showNotif(`📅 Смена для ${escapeHtml(data.employee)} обновлена`, 'info');
            });
            
        } catch (err) {
            console.error('Pusher error:', err);
            if (syncIndicator) syncIndicator.classList.remove('online', 'connecting');
            isPusherInitializing = false;
            schedulePusherReconnect();
        }
    }
    
    function schedulePusherReconnect() {
        if (pusherReconnectTimer) clearTimeout(pusherReconnectTimer);
        pusherInitAttempts++;
        if (pusherInitAttempts <= MAX_PUSHER_ATTEMPTS) {
            const delay = Math.min(30000, 2000 * Math.pow(2, pusherInitAttempts));
            console.log(`🔄 Переподключение Pusher через ${delay}ms (попытка ${pusherInitAttempts}/${MAX_PUSHER_ATTEMPTS})`);
            pusherReconnectTimer = setTimeout(() => initPusher(), delay);
        }
    }
    
    window.initPusher = initPusher;
    
    const token = localStorage.getItem('token');
    if (token) {
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            try {
                const user = JSON.parse(savedUser);
                window.app = window.app || {};
                window.app.currentUser = user.name;
                window.app.currentUserRole = user.role;
                
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                document.getElementById('headerName').textContent = user.name;
                
                loadEmployees().then(() => { loadTasks(); loadFines(); loadSchedule(); renderMainMenu(); });
                setTimeout(() => initPusher(), 1000);
            } catch(e) {
                localStorage.removeItem('currentUser');
                localStorage.removeItem('token');
            }
        }
    }
    
    window.updateHeaderAvatar = function(avatarUrl, avatarEmoji) {
        const headerAvatar = document.getElementById('headerAvatar');
        if (headerAvatar) {
            if (avatarUrl) headerAvatar.innerHTML = `<img src="${escapeHtml(avatarUrl)}" style="width:100%;height:100%;object-fit:cover;">`;
            else if (avatarEmoji) headerAvatar.innerHTML = escapeHtml(avatarEmoji);
            else headerAvatar.innerHTML = '👤';
        }
    };
</script>
</body>
</html>
