<script>
    const PUSHER_KEY = '91e6eb7093c4b16a3275';
    const PUSHER_CLUSTER = 'ap1';
    const CHANNEL_NAME = 'private-warpoint-sync';
    
    let pusher = null;
    let channel = null;
    
    function transliterateForChannel(name) {
        const ru = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
        let result = '';
        for (let i = 0; i < name.length; i++) {
            const char = name[i];
            if (ru[char]) result += ru[char];
            else if (char.match(/[a-zA-Z0-9]/)) result += char.toLowerCase();
        }
        result = result.replace(/[^a-z0-9]/g, '');
        const defaultNames = {'Денис':'denis','Андрей':'andrey','Максим':'maxim'};
        if (result === '' || result.length < 3) result = defaultNames[name] || 'user';
        return result;
    }
    
    function initPusher() {
        const token = localStorage.getItem('token');
        if (!token) return;
        try {
            pusher = new Pusher(PUSHER_KEY, {
                cluster: PUSHER_CLUSTER, forceTLS: true,
                authEndpoint: '/api/pusher/auth',
                auth: { headers: { 'Authorization': 'Bearer ' + token } }
            });
            window.pusher = pusher;
            channel = pusher.subscribe(CHANNEL_NAME);
            window.channel = channel;
            
            const currentUser = window.app?.currentUser;
            if (currentUser) {
                const userTranslit = transliterateForChannel(currentUser);
                window.privateChannel = pusher.subscribe('private-user-' + userTranslit);
            }
            
            channel.bind('pusher:subscription_succeeded', function() {
                document.getElementById('syncIndicator').classList.add('online');
                document.getElementById('syncIndicator').classList.remove('offline');
                document.getElementById('syncText').innerHTML = 'Синхронизация активна';
            });
            
            channel.bind('schedule-updated', function(data) {
                if (typeof loadScheduleData === 'function') loadScheduleData();
                if (typeof updateNextShiftInfo === 'function') updateNextShiftInfo();
                if (typeof updateDashboardStats === 'function') updateDashboardStats();
                if (typeof renderEmployees === 'function') renderEmployees();
                showNotif(`📅 Смена для ${data.employee} обновлена`, 'info');
            });
        } catch (err) { console.error('Pusher error:', err); }
    }
    
    window.addEventListener('load', () => {
    if (typeof loadCurrentTheme === 'function') loadCurrentTheme();
    const token = localStorage.getItem('token');
    if (token) {
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            const user = JSON.parse(savedUser);
            window.app = window.app || {};
            window.app.currentUser = user.name;
            window.app.currentUserRole = user.role;
            
            // 🔥 ДОБАВЛЕНО: проверяем достижения при обновлении страницы
            checkAchievementsOnRefresh(user.id, user.name);
            
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('headerName').textContent = user.name;
            initPusher();
            loadEmployees().then(() => { loadTasks(); loadFines(); loadSchedule(); renderMainMenu(); });
        }
    }
});

// 🔥 НОВАЯ ФУНКЦИЯ
async function checkAchievementsOnRefresh(userId, username) {
    try {
        const token = localStorage.getItem('token');
        const response = await fetch('/api/achievements/check', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            }
        });
        const data = await response.json();
        if (data && data.newAchievements && data.newAchievements.length > 0) {
            for (const ach of data.newAchievements) {
                showNotif(`🏆 Новое достижение: ${ach.name} (+${ach.coins} WP)`, 'success');
            }
        }
    } catch (err) {
        console.error('Ошибка проверки достижений:', err);
    }
}
    
    window.updateHeaderAvatar = function(avatarUrl, avatarEmoji) {
        const headerAvatar = document.getElementById('headerAvatar');
        if (headerAvatar) {
            if (avatarUrl) headerAvatar.innerHTML = `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;">`;
            else if (avatarEmoji) headerAvatar.innerHTML = avatarEmoji;
            else headerAvatar.innerHTML = '👤';
        }
    };
</script>

<canvas id="particlesCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;"></canvas>
<script>
(function() {
    const canvas = document.getElementById('particlesCanvas');
    if (!canvas) return;
    let ctx = canvas.getContext('2d');
    let particles = [];
    let width, height;
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
    function createParticle() {
        return {
            x: Math.random() * width, y: Math.random() * height,
            radius: Math.random() * 2 + 1, alpha: Math.random() * 0.3 + 0.1,
            speedX: (Math.random() - 0.5) * 0.2, speedY: (Math.random() - 0.5) * 0.15,
            color: ['#6366f1', '#8b5cf6', '#a78bfa', '#c084fc'][Math.floor(Math.random() * 4)]
        };
    }
    function initParticles() { particles = []; for (let i = 0; i < 60; i++) particles.push(createParticle()); }
    function drawParticles() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        for (let p of particles) {
            p.x += p.speedX; p.y += p.speedY;
            if (p.x < -50) p.x = width + 50; if (p.x > width + 50) p.x = -50;
            if (p.y < -50) p.y = height + 50; if (p.y > height + 50) p.y = -50;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color; ctx.shadowBlur = 8; ctx.shadowColor = p.color;
            ctx.globalAlpha = p.alpha; ctx.fill();
        }
        requestAnimationFrame(drawParticles);
    }
    window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
    resizeCanvas(); initParticles(); drawParticles();
})();
</script>
