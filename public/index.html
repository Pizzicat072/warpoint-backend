        }

        }
        .sync-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;

</head>

<script>
// ==================== КОНФИГУРАЦИЯ ====================
const API_URL = '/api';
const PUSHER_KEY = '91e6eb7093c4b16a3275';
const PUSHER_CLUSTER = 'ap1';
const CHANNEL_NAME = 'public-warpoint-sync';
const SESSION_ID = Math.random().toString(36).substr(2, 9);

let pusher = null;
let channel = null;
let wsConnected = false;

// ==================== ГЛОБАЛЬНЫЕ ДАННЫЕ ====================
let employees = [];
let profiles = {};
let tasks = [];
let currentUser = null;
let currentUserRole = null;
let currentUserPermissions = null;
let lastActivity = {};

const roleNames = { director: 'Директор', manager: 'Управляющий', admin: 'Админ', operator: 'Оператор' };
const rolesMap = {
    director: { name: 'Директор', level: 4, canEdit: true, canDelete: true, canEditTasks: true, canEditSite: true },
    manager: { name: 'Управляющий', level: 3, canEdit: true, canDelete: true, canEditTasks: true, canEditSite: true },
    admin: { name: 'Админ', level: 2, canEdit: false, canDelete: false, canEditTasks: true, canEditSite: false },
    operator: { name: 'Оператор', level: 1, canEdit: false, canDelete: false, canEditTasks: true, canEditSite: false }
};
let availableRoles = ['director', 'manager', 'admin', 'operator'];

const avatars = ['👤', '😎', '🔥', '⚡', '🎯', '🏆', '🦸', '👑'];
const statusesList = ['💼 Работаю', '☕ Перерыв', '🎯 В фокусе', '⭐ MVP', '🚀 Взлёт'];
const backgroundsList = [
    { id: 'bg_default', name: 'Тёмный сапфир', gradient: 'linear-gradient(135deg, #0F172A, #1E1B4B)' },
    { id: 'bg_cyber', name: 'Киберпространство', gradient: 'linear-gradient(135deg, #1E1B4B, #2D2A5E)' },
    { id: 'bg_fire', name: 'Багряный закат', gradient: 'linear-gradient(135deg, #7F1A1A, #991B1B)' }
];

const gifts = [
    { id: 'flower', name: 'Букет цветов', icon: '🌸', price: 10, ratingChange: 8, isGood: true },
    { id: 'chocolate', name: 'Шоколад', icon: '🍫', price: 15, ratingChange: 12, isGood: true },
    { id: 'star', name: 'Золотая звезда', icon: '⭐', price: 25, ratingChange: 20, isGood: true },
    { id: 'trophy', name: 'Трофей', icon: '🏆', price: 50, ratingChange: 35, isGood: true },
    { id: 'poop', name: 'Какашка', icon: '💩', price: 5, ratingChange: -15, isGood: false },
    { id: 'rotten', name: 'Тухлое яйцо', icon: '🥚', price: 8, ratingChange: -12, isGood: false },
    { id: 'socks', name: 'Вонючие носки', icon: '🧦', price: 8, ratingChange: -12, isGood: false },
    { id: 'fish', name: 'Дохлая рыба', icon: '🐟', price: 12, ratingChange: -18, isGood: false }
];

// ==================== API ВЫЗОВЫ ====================
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}
async function apiCall(endpoint, method = 'GET', body = null) {
    const options = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) options.body = JSON.stringify(body);
    try {
        const response = await fetch(`${API_URL}${endpoint}`, options);
        return await response.json();
    } catch(e) {
        console.error('API error:', e);
        showNotif('❌ Ошибка связи с сервером', 'error');
        return null;
    }
}

async function loadData() {
    const data = await apiCall('/data');
    if (data) {
        employees = data.employees || [];
        profiles = data.profiles || {};
        tasks = data.tasks || [];
        for(let emp of employees) {
            if(!profiles[emp]) profiles[emp] = { avatar: '👤', name: emp, status: '💼 Работаю', coins: 100, rating: 0, background: 'bg_default', role: 'operator', hours: 0, stickers: {} };
            if(!profiles[emp].stickers) profiles[emp].stickers = {};
        }
    }
}

// ==================== PUSHER СИНХРОНИЗАЦИЯ ====================
function initPusher() {
    try {
        pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER, forceTLS: true });
        channel = pusher.subscribe(CHANNEL_NAME);
        
        channel.bind('pusher:subscription_succeeded', () => {
            wsConnected = true;
            const indicator = document.getElementById('syncIndicator');
            indicator.classList.remove('offline');
            indicator.classList.add('online');
            document.getElementById('syncText').innerHTML = '<i class="fas fa-check-circle"></i> Синхронизация активна';
            showNotif('✅ Real-time синхронизация активна!', 'success');
        });
        
        channel.bind('pusher:subscription_error', () => {
            wsConnected = false;
            const indicator = document.getElementById('syncIndicator');
            indicator.classList.remove('online');
            indicator.classList.add('offline');
            document.getElementById('syncText').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Офлайн режим';
        });
        
        // Обработчики событий
        channel.bind('client-employee-add', (data) => {
            if(data.sessionId === SESSION_ID) return;
            if(!employees.includes(data.employee)) {
                employees.push(data.employee);
                profiles[data.employee] = data.profile;
                renderEmployees();
                updateStats();
                updateRatingTable();
                showNotif(`👥 Новый сотрудник: ${data.employee}`, 'info');
            }
        });
        
        channel.bind('client-employee-delete', (data) => {
            if(data.sessionId === SESSION_ID) return;
            if(employees.includes(data.employee)) {
                employees = employees.filter(e => e !== data.employee);
                delete profiles[data.employee];
                renderEmployees();
                updateStats();
                updateRatingTable();
                showNotif(`👋 Сотрудник ${data.employee} удалён`, 'info');
            }
        });
        
        channel.bind('client-profile-update', (data) => {
            if(data.sessionId === SESSION_ID) return;
            if(profiles[data.employee]) {
                profiles[data.employee] = { ...profiles[data.employee], ...data.updates };
                renderEmployees();
                if(currentUser === data.employee) {
                    document.getElementById('headerAvatar').innerHTML = profiles[data.employee]?.avatar;
                }
                showNotif(`🔄 ${data.user} обновил профиль ${data.employee}`, 'info');
            }
        });
        
        channel.bind('client-gift-send', (data) => {
            if(data.sessionId === SESSION_ID) return;
            if(profiles[data.recipient]) {
                profiles[data.recipient].coins -= data.price;
                profiles[data.recipient].rating += data.ratingChange;
                if(!profiles[data.recipient].stickers) profiles[data.recipient].stickers = {};
                if(!profiles[data.recipient].stickers[data.giftId]) profiles[data.recipient].stickers[data.giftId] = 0;
                profiles[data.recipient].stickers[data.giftId]++;
                renderEmployees();
                updateRatingTable();
                showNotif(`${data.sender} подарил ${data.giftName} ${data.recipient}`, data.ratingChange > 0 ? 'success' : 'info');
            }
        });
        
        channel.bind('client-task-add', (data) => {
            if(data.sessionId === SESSION_ID) return;
            tasks.push(data.task);
            renderTasks();
            updateStats();
            showNotif(`📋 Новая задача: ${data.task.name}`, 'info');
        });
        
        channel.bind('client-task-update', (data) => {
            if(data.sessionId === SESSION_ID) return;
            if(tasks[data.index]) {
                tasks[data.index].status = data.status;
                renderTasks();
                updateStats();
            }
        });
        
        channel.bind('client-task-delete', (data) => {
            if(data.sessionId === SESSION_ID) return;
            if(tasks[data.index]) {
                tasks.splice(data.index, 1);
                renderTasks();
                updateStats();
            }
        });
        
        channel.bind('client-admin-bonus', (data) => {
            if(data.sessionId === SESSION_ID) return;
            employees.forEach(e => { profiles[e].coins += data.coins; profiles[e].rating += data.rating; });
            renderEmployees();
            updateRatingTable();
            showNotif(`🎉 Бонусы выданы всем! +${data.coins} монет, +${data.rating} рейтинга`, 'success');
        });
        
        channel.bind('client-reset-all-data', () => {
            showNotif(`🔄 Данные были сброшены администратором! Страница обновится...`, 'warning');
            setTimeout(() => location.reload(), 1500);
        });
        
    } catch(e) {
        console.error('Pusher error:', e);
        wsConnected = false;
        document.getElementById('syncIndicator').classList.add('offline');
        document.getElementById('syncText').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Офлайн режим';
    }
}

function sendSync(event, data) {
    if(wsConnected && channel) {
        channel.trigger(event, { ...data, sessionId: SESSION_ID });
    }
}

// ==================== ОСНОВНЫЕ ФУНКЦИИ ====================
function showNotif(msg, type) {
    let n = document.createElement('div');
    n.className = 'notification';
    n.style.borderLeftColor = type === 'error' ? '#f87171' : type === 'warning' ? '#f59e0b' : '#34d399';
    n.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'check-circle'}"></i> ${msg}`;
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 3000);
}

function getUserStatus(emp) {
    let last = lastActivity[emp];
    if(!last) return { text: 'Не в сети', class: 'offline' };
    let diff = (Date.now() - last) / 1000;
    if(diff < 120) return { text: 'В сети', class: 'online' };
    return { text: 'Не в сети', class: 'offline' };
}

function getTitleByRating(rating) {
    if(rating >= 500) return '👑 Легенда';
    if(rating >= 300) return '💎 Профессионал';
    if(rating >= 150) return '🏆 Эксперт';
    if(rating >= 50) return '🔥 Мастер';
    if(rating >= 1) return '⭐ Ученик';
    return '🌱 Новичок';
}

function renderTasks() {
    const tbody = document.getElementById('tasksTableBody');
    const today = new Date().toISOString().split('T')[0];
    tasks.forEach(task => { if(task.deadline && task.deadline < today && task.status === 'В процессе') task.status = 'Не выполнено'; });
    tbody.innerHTML = tasks.map((t, idx) => {
        const authorInfo = t.authorName && t.authorRole ? `${t.authorName} (${t.authorRole})` : t.author || '—';
        const executorInfo = t.executorRole ? `${roleNames[t.executorRole]} (все)` : t.executor || '—';
        let statusClass = t.status === 'Выполнено' ? 'task-status-completed' : t.status === 'Не выполнено' ? 'task-status-failed' : 'task-status-progress';
        return `<tr><td>${t.date||'—'}</td><td><strong>${t.name}</strong></td><td>${authorInfo}</td><td>${executorInfo}</td><td>${t.deadline||'—'}</td><td><span class="${statusClass}">${t.status}</span></td><td><button class="btn-secondary" style="padding:4px 8px;" onclick="changeTaskStatus(${idx},'Выполнено')"><i class="fas fa-check"></i></button> <button class="btn-secondary" style="padding:4px 8px;" onclick="changeTaskStatus(${idx},'В процессе')"><i class="fas fa-play"></i></button> <button class="btn-secondary" style="padding:4px 8px; background:#ef4444;" onclick="deleteTask(${idx})"><i class="fas fa-trash"></i></button></td></tr>`;
    }).join('');
    if(!tasks.length) tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon">📋</div><p>Нет задач</p></div></td></tr>';
    const completed = tasks.filter(t => t.status === 'Выполнено').length;
    document.getElementById('statTasksDone').textContent = completed;
}

async function addTask() {
    const name = document.getElementById('taskName').value.trim();

    const executorRole = document.getElementById('taskExecutorRole').value;
    const deadline = document.getElementById('taskDeadline').value;

        date: new Date().toISOString().split('T')[0],

async function sendGiftToBackend(recipient, gift, quantity, anonymous) {
    const totalPrice = gift.price * quantity;
    if(profiles[currentUser].coins < totalPrice) { showNotif('Недостаточно монет','error'); return; }
    await apiCall('/gifts', 'POST', {
        recipient, giftId: gift.id, giftName: gift.name, price: totalPrice,
        ratingChange: gift.ratingChange * quantity,
        sender: anonymous ? '🕵️ Аноним' : currentUser
    });
    sendSync('client-gift-send', {
        recipient, giftId: gift.id, giftName: gift.name, price: totalPrice,
        ratingChange: gift.ratingChange * quantity, sender: anonymous ? '🕵️ Аноним' : currentUser
    });
    await loadData();
    renderEmployees();
    updateRatingTable();
    showNotif(`✅ ${quantity}x ${gift.name} отправлен!`, 'success');
}

async function saveProfileChanges(emp) {
    let newName = document.getElementById('editProfileName')?.value;
    if (!newName) newName = emp;
    newName = newName.trim();
    
    if (newName !== emp && employees.includes(newName)) { 
        showNotif('Имя занято', 'error'); 
        return; 
    }
    
    // Сохраняем изменения
    if (newName !== emp) {
        // Создаем нового сотрудника с новым именем
        const profile = { ...profiles[emp], name: newName };
        await apiCall(`/employees/${emp}`, 'DELETE');
        sendSync('client-employee-delete', { employee: emp });
        await apiCall('/employees', 'POST', { employee: newName, profile });
        sendSync('client-employee-add', { employee: newName, profile });
        
        if (currentUser === emp) currentUser = newName;
        emp = newName;
    }
    
    // Обновляем имя в профиле
    await apiCall(`/profiles/${emp}`, 'PUT', { 
        updates: { name: newName }, 
        user: currentUser 
    });
    sendSync('client-profile-update', { 
        employee: emp, 
        updates: { name: newName }, 
        user: currentUser 
    });
    
    await loadData();
    renderEmployees();
    updateRatingTable();
    closeProfileModal();
    showNotif('✅ Профиль сохранён', 'success');
}

async function deleteEmployee(emp) {
    if(confirm(`Удалить ${emp}?`)) {
        await apiCall(`/employees/${emp}`, 'DELETE');
        sendSync('client-employee-delete', { employee: emp });
        await loadData();
        renderEmployees();
        updateStats();
        closeProfileModal();
        showNotif(`❌ ${emp} удалён`,'error');
    }
}

let selectedGift = null;
function selectGift(id, price, rating) { selectedGift = { id, price, rating }; showNotif('Выберите способ отправки','info'); }

async function sendGiftTo(target, anonymous) {
    if(!selectedGift) { showNotif('Сначала выберите подарок','error'); return; }
    let gift = gifts.find(g => g.id === selectedGift.id);
    await sendGiftToBackend(target, gift, 1, anonymous);
    closeSendGiftModal();
    closeProfileModal();
    selectedGift = null;
}

function updateRatingTable() {
    let sorted = [...employees].sort((a,b)=>(profiles[b]?.rating||0)-(profiles[a]?.rating||0));
    document.getElementById('ratingTableBody').innerHTML = sorted.map((e,i)=>{ let p=profiles[e]; let title=getTitleByRating(p?.rating||0); return `<tr><td>${i+1}</td><td>${p?.avatar} ${p?.name}</td><td>${p?.hours||0}</td><td style="color:${(p?.rating||0)>=0?'#10B981':'#EF4444'}">${(p?.rating||0)>=0?'+':''}${p?.rating||0}</td><td>💰 ${p?.coins||0}</td><td>${title}</td></tr>`; }).join('');
}

function updateStats() {
    document.getElementById('statTotalEmployees').textContent = employees.length;
    document.getElementById('statOnline').textContent = employees.filter(e=>getUserStatus(e).class==='online').length;
}

function switchUserTo(name, role) {
    currentUser = name;
    currentUserRole = role;
    currentUserPermissions = rolesMap[role] || rolesMap.operator;
    
    const p = profiles[name];
    if (!p) {
        console.error('Profile not found:', name);
        return;
    }
    
    document.getElementById('headerName').textContent = name;
    document.getElementById('headerAvatar').innerHTML = p.avatar || '👤';
    const status = getUserStatus(name);
    document.getElementById('headerStatus').innerHTML = `<i class="fas fa-circle" style="font-size:8px;color:${status.class==='online'?'#34d399':'#6b7280'}"></i> ${status.text}`;
    
    lastActivity[name] = Date.now();
    
    renderEmployees();
    renderTasks();
    renderShop();
    renderAdminTools();
    updateStats();
    updateRatingTable();
    
    document.getElementById('welcomeCard').innerHTML = `
        <div style="display:flex; align-items:center; gap:16px;">
            <div style="font-size:48px;">${p.avatar || '👤'}</div>
            <div>
                <h2>Добро пожаловать, ${escapeHtml(name)}!</h2>
                <p>Рейтинг: ${p.rating || 0}, монет: ${p.coins || 0}</p>
                <p>Вы ${roleNames[role] || role}</p>
            </div>
        </div>
    `;
}
function switchUser() {
    const selected = document.getElementById('userSwitchSelect').value;
    if(!selected) return;
    const [role, name] = selected.split('_');
    switchUserTo(name, role);
}

function openCreateEmployeeModal() { populateRoleSelect(); document.getElementById('createEmployeeModal').classList.add('active'); }
function closeCreateEmployeeModal() { document.getElementById('createEmployeeModal').classList.remove('active'); }
function populateRoleSelect() { document.getElementById('newEmpRole').innerHTML = availableRoles.map(r=>`<option value="${r}">${roleNames[r]}</option>`).join(''); }
function closeProfileModal() { document.getElementById('profileModal').classList.remove('active'); }
function openMyProfile() { if(currentUser) openProfile(currentUser); }
function closeSendGiftModal() { document.getElementById('sendGiftModal').classList.remove('active'); selectedGift = null; currentGift = null; }
function closeAddTaskModal() { document.getElementById('addTaskModal').classList.remove('active'); }
function openAddTaskModal() {
    document.getElementById('taskAuthor').innerHTML = employees.map(e => `<option value="${e}" data-role="${profiles[e]?.role}">${e} (${roleNames[profiles[e]?.role]})</option>`).join('');
    document.getElementById('taskExecutorRole').innerHTML = '<option value="">Выберите должность</option>' + availableRoles.map(r => `<option value="${r}">${roleNames[r]}</option>`).join('');
    document.getElementById('addTaskModal').classList.add('active');
}
function openStatusShop() { setSelfStatus(statusesList[0]); }
function openAvatarShop() { setSelfAvatar(avatars[0]); }

function renderAdminTools() {
    const isAdmin = currentUserPermissions?.canEditSite;
    document.getElementById('adminMenuTab').style.display = isAdmin ? 'flex' : 'none';
    if(!isAdmin) {
        document.getElementById('adminToolsContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔒</div><h3>Доступ ограничен</h3><p>Только руководители</p></div>';
        return;
    }
    document.getElementById('adminToolsContainer').innerHTML = `
        <div class="tool-card" style="background:rgba(0,0,0,0.4); border-radius:20px; padding:20px; border:1px solid rgba(99,102,241,0.3);"><h4>🎁 Бонусы всем</h4><input type="number" id="bonusCoins" placeholder="Монеты" style="background:#1e293b; border:1px solid #6366f1; border-radius:30px; padding:8px 12px; color:white; width:100%; margin:8px 0;"><input type="number" id="bonusRating" placeholder="Рейтинг" style="background:#1e293b; border:1px solid #6366f1; border-radius:30px; padding:8px 12px; color:white; width:100%; margin:8px 0;"><button class="btn-primary" onclick="giveBonusToAll()" style="width:100%;">Выдать</button></div>
        <div class="tool-card" style="background:rgba(0,0,0,0.4); border-radius:20px; padding:20px; border:1px solid rgba(99,102,241,0.3);"><h4>📋 Очистка задач</h4><button class="btn-secondary" onclick="clearCompletedTasks()" style="width:100%;">Удалить выполненные</button><button class="btn-secondary" style="background:#ef4444; width:100%; margin-top:8px;" onclick="clearAllTasks()">Удалить все</button></div>
        <div class="tool-card" style="background:rgba(0,0,0,0.4); border-radius:20px; padding:20px; border:1px solid rgba(99,102,241,0.3);"><h4>🗑️ Сброс данных</h4><button class="btn-secondary" style="background:#ef4444; width:100%;" onclick="resetAllData()">Сбросить всё (синхронно)</button></div>
    `;
}

async function giveBonusToAll() {
    let coins = parseInt(document.getElementById('bonusCoins').value) || 0;
    let rating = parseInt(document.getElementById('bonusRating').value) || 0;
    await apiCall('/admin/bonus', 'POST', { coins, rating });
    sendSync('client-admin-bonus', { coins, rating });
    await loadData();
    renderEmployees();
    updateRatingTable();
    showNotif(`🎉 Бонусы выданы всем! +${coins} монет, +${rating} рейтинга`, 'success');
}

async function clearCompletedTasks() {
    await apiCall('/tasks/completed', 'DELETE');
    sendSync('client-task-delete', { all: true });
    await loadData();
    renderTasks();
    showNotif('✅ Выполненные задачи удалены', 'success');
}

async function clearAllTasks() {
    if(confirm('Удалить ВСЕ задачи?')) {
        tasks = [];
        await apiCall('/tasks', 'DELETE');
        sendSync('client-task-delete', { all: true });
        await loadData();
        renderTasks();
        showNotif('✅ Все задачи удалены', 'success');
    }
}

async function resetAllData() {
    if(confirm('Удалить ВСЕ данные? Это действие синхронизируется со всеми пользователями! Отменить нельзя.')) {
        await apiCall('/admin/reset', 'DELETE');
        sendSync('client-reset-all-data', { confirm: 'yes' });
        showNotif('✅ Все данные удалены! Страница обновится...', 'success');
        setTimeout(() => location.reload(), 1000);
    }
}

// ==================== ЗАПУСК ====================
initPusher();
loadData().then(() => {
    if(employees.length > 0) {
        switchUserTo(employees[0], profiles[employees[0]]?.role || 'operator');
    } else {
        document.getElementById('welcomeCard').innerHTML = `<div class="empty-state"><div class="empty-state-icon">🚀</div><h2>Добро пожаловать в WARPOINT!</h2><button class="btn-primary" onclick="openCreateEmployeeModal()">Создать первого сотрудника</button></div>`;
    }
    renderEmployees();
    renderTasks();
    renderShop();
    renderAdminTools();
    updateStats();
    updateRatingTable();
});

document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
        document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(`tab-${item.dataset.tab}`).classList.add('active');
        if(item.dataset.tab === 'admin') renderAdminTools();
    });
});
</script>
</body>
